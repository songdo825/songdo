<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프로필 · songdo</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#1d2b16;background:#f7ffe8}header{height:72px;background:#f0fbdc;border-bottom:1px solid #dcebbf;display:flex;align-items:center;justify-content:space-between;padding:0 24px}a{color:inherit;text-decoration:none}.brand{font-size:28px;font-weight:800;color:#365c22}.home{height:38px;display:flex;align-items:center;padding:0 14px;border:1px solid #86b94f;border-radius:10px;font-size:13px;font-weight:700;background:#fff}.wrap{max-width:820px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #dcebbf;border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 8px 28px rgba(76,110,43,.06)}.profile-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.email{font-size:21px;font-weight:800}.sub{color:#718160;font-size:12px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field select{width:100%;height:42px;border:1px solid #cfdfb4;border-radius:9px;background:#fff;padding:0 10px}.save{margin-top:14px;width:100%;height:42px;border:0;border-radius:10px;background:#9bd85b;color:#203315;font-weight:800;cursor:pointer}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{padding:14px;border:1px solid #dcebbf;border-radius:12px;background:#fbfff4}.fact span{display:block;color:#718160;font-size:11px;margin-bottom:5px}.fact b{font-size:18px}.section-title{font-size:18px;font-weight:800;margin:0 0 12px}.trip-list{display:flex;flex-direction:column;gap:8px}.trip{padding:13px 14px;background:#fbfff4;border:1px solid #dcebbf;border-radius:11px;display:flex;justify-content:space-between;gap:12px}.trip-name{font-weight:800}.trip-date{font-size:12px;color:#68775a;text-align:right}.empty{color:#8a987d;font-size:13px;padding:12px 0}.status{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;background:#e8f7cf;color:#4f6d31;font-size:10px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#527c2d;color:#fff;padding:10px 14px;border-radius:9px;display:none}.toast.show{display:block}@media(max-width:620px){.grid,.facts{grid-template-columns:1fr}.profile-top{display:block}.wrap{margin-top:18px}}</style></head><body><header><a class="brand" href="/">songdo</a><a class="home" href="/">← 지도로 돌아가기</a></header><main class="wrap"><section class="card"><div class="profile-top"><div><div class="email" id="email">프로필</div><div class="sub">내 여행 정보</div></div></div><div class="grid"><div class="field"><label>어디서 왔나요?</label><select id="homeCity"></select></div><div class="field"><label>현재 위치</label><select id="currentCity"></select></div></div><button class="save" id="saveProfile">프로필 저장</button></section><section class="card"><div class="facts"><div class="fact"><span>출신 / 거주 기반</span><b id="homeFact">설정 안 됨</b></div><div class="fact"><span>현재 위치</span><b id="currentFact">설정 안 됨</b></div></div></section><section class="card"><h2 class="section-title">여행한 곳</h2><div id="pastTrips" class="trip-list"></div></section><section class="card"><h2 class="section-title">현재 · 예정 여행</h2><div id="activeTrips" class="trip-list"></div></section></main><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const cities={tokyo:'도쿄',seoul:'서울',newyork:'뉴욕',paris:'파리',london:'런던',barcelona:'바르셀로나',rome:'로마',bangkok:'방콕',singapore:'싱가포르',sydney:'시드니',amsterdam:'암스테르담',berlin:'베를린',vienna:'빈',prague:'프라하',istanbul:'이스탄불',dubai:'두바이',hongkong:'홍콩',taipei:'타이베이',losangeles:'로스앤젤레스',mexicocity:'멕시코시티'};const client=supabase.createClient('https://vquxardponweuvuvdtyc.supabase.co','sb_publishable_PbBHugcKsWE_jgpVTou75A_Hq_8oeUy');let session=null,profile=null,visits=[];const options='<option value="">선택 안 함</option>'+Object.entries(cities).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');document.getElementById('homeCity').innerHTML=options;document.getElementById('currentCity').innerHTML=options;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function fmtDate(s){return new Date(s+'T00:00:00').toLocaleDateString('ko-KR')}function render(){document.getElementById('homeCity').value=profile?.home_city||'';document.getElementById('currentCity').value=profile?.current_city||'';document.getElementById('homeFact').textContent=profile?.home_city?cities[profile.home_city]||profile.home_city:'설정 안 됨';document.getElementById('currentFact').textContent=profile?.current_city?cities[profile.current_city]||profile.current_city:'설정 안 됨';const d=new Date().toISOString().slice(0,10),past=visits.filter(v=>v.end_date<d).sort((a,b)=>b.end_date.localeCompare(a.end_date)),active=visits.filter(v=>v.end_date>=d).sort((a,b)=>a.start_date.localeCompare(b.start_date));document.getElementById('pastTrips').innerHTML=past.length?past.map(v=>'<div class="trip"><div><div class="trip-name">'+(cities[v.city]||v.city)+'</div><span class="status">방문 완료</span></div><div class="trip-date">'+fmtDate(v.start_date)+'<br>~ '+fmtDate(v.end_date)+'</div></div>').join(''):'<div class="empty">아직 완료된 여행 기록이 없습니다.</div>';document.getElementById('activeTrips').innerHTML=active.length?active.map(v=>'<div class="trip"><div><div class="trip-name">'+(cities[v.city]||v.city)+'</div><span class="status">'+(v.start_date<=d?'방문 중':'방문 예정')+'</span></div><div class="trip-date">'+fmtDate(v.start_date)+'<br>~ '+fmtDate(v.end_date)+'</div></div>').join(''):'<div class="empty">현재 또는 예정된 여행이 없습니다.</div>'}async function load(){const {data}=await client.auth.getSession();session=data.session;if(!session){location.href='/login.html';return}document.getElementById('email').textContent=session.user.email||'내 프로필';const [p,v]=await Promise.all([client.from('user_profiles').select('user_id,home_city,current_city').eq('user_id',session.user.id).maybeSingle(),client.from('city_visits').select('city,start_date,end_date').eq('user_id',session.user.id)]);profile=p.data||null;visits=v.data||[];render()}document.getElementById('saveProfile').onclick=async()=>{if(!session)return;const payload={user_id:session.user.id,home_city:document.getElementById('homeCity').value||null,current_city:document.getElementById('currentCity').value||null,updated_at:new Date().toISOString()};const {error}=await client.from('user_profiles').upsert(payload,{onConflict:'user_id'});if(error){toast('저장 중 오류가 발생했습니다.');return}profile=payload;render();toast('프로필이 저장되었습니다.')};load();</script></body></html>
