<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프로필 · songdo</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:Arial,sans-serif;color:#1d2b16;background:#f7ffe8}header{height:72px;background:#f0fbdc;border-bottom:1px solid #dcebbf;display:flex;align-items:center;justify-content:space-between;padding:0 24px}a{color:inherit;text-decoration:none}.brand{font-size:28px;font-weight:800;color:#365c22}.home{height:38px;display:flex;align-items:center;padding:0 14px;border:1px solid #86b94f;border-radius:10px;font-size:13px;font-weight:700;background:#fff}.wrap{max-width:860px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #dcebbf;border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 8px 28px rgba(76,110,43,.06)}.profile-top{display:flex;gap:18px;align-items:center}.avatar-wrap{position:relative;width:92px;height:92px;flex:0 0 92px}.avatar,.avatar-placeholder{position:absolute;inset:0;width:92px;height:92px;border-radius:50%;border:2px solid #dcebbf;background:#eff8df}.avatar{object-fit:cover;display:block}.avatar-placeholder{display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#55753a}.avatar-btn{position:absolute;right:-4px;bottom:0;z-index:3;width:31px;height:31px;border:0;border-radius:50%;background:#365c22;color:#fff;cursor:pointer;font-size:15px}.name{font-size:22px;font-weight:800}.email-line{font-size:12px;color:#718160;margin-top:5px}.sub{color:#718160;font-size:12px}.hint{font-size:11px;color:#8a987d;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field select,.field input{width:100%;height:42px;border:1px solid #cfdfb4;border-radius:9px;background:#fff;padding:0 10px;font:inherit}.checkrow{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:13px}.checkrow input{width:16px;height:16px}.save,.add{margin-top:14px;width:100%;height:42px;border:0;border-radius:10px;background:#9bd85b;color:#203315;font-weight:800;cursor:pointer}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fact{padding:14px;border:1px solid #dcebbf;border-radius:12px;background:#fbfff4}.fact span{display:block;color:#718160;font-size:11px;margin-bottom:5px}.fact b{font-size:16px}.section-title{font-size:18px;font-weight:800;margin:0}.trip-form{margin-top:16px;padding:16px;border:1px solid #dcebbf;border-radius:12px;background:#fbfff4}.trip-form .grid{margin-top:0}.trip-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.trip{padding:14px;background:#fbfff4;border:1px solid #dcebbf;border-radius:11px;display:flex;justify-content:space-between;gap:12px;align-items:center}.trip-name{font-weight:800}.trip-note{font-size:12px;color:#68775a;margin-top:6px}.trip-right{display:flex;align-items:center;gap:10px}.trip-date{font-size:12px;color:#68775a;text-align:right;white-space:nowrap}.delete{border:1px solid #e1c7c1;background:#fff;color:#9b4b3d;border-radius:8px;height:32px;padding:0 10px;cursor:pointer}.empty{color:#8a987d;font-size:13px;padding:12px 0}.status{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;background:#e8f7cf;color:#4f6d31;font-size:10px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#527c2d;color:#fff;padding:10px 14px;border-radius:9px;display:none}.toast.show{display:block}.version{text-align:center;color:#9aa88d;font-size:10px;padding:6px 0 24px}@media(max-width:650px){.grid,.facts{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid,.facts{grid-template-columns:1fr}.avatar-wrap,.avatar,.avatar-placeholder{width:76px;height:76px}.avatar-wrap{flex-basis:76px}.trip{display:block}.trip-right{margin-top:10px;justify-content:space-between}.trip-date{text-align:left}}</style></head><body><header><a class="brand" href="/">songdo</a><a class="home" href="/">← 지도로 돌아가기</a></header><main class="wrap"><section class="card"><div class="profile-top"><div class="avatar-wrap"><div id="avatarPlaceholder" class="avatar-placeholder">S</div><img id="avatar" class="avatar" alt="프로필 사진" hidden><button class="avatar-btn" id="avatarBtn" title="프로필 사진 변경">＋</button><input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden></div><div><div class="name" id="displayName">내 프로필</div><div class="email-line" id="emailLine" hidden></div><div class="hint">사진은 JPG, PNG, WEBP, GIF · 최대 3MB</div></div></div><div class="grid"><div class="field"><label>닉네임</label><input id="nickname" maxlength="20" placeholder="2~20자"></div><div class="field"><label>어디서 왔나요?</label><select id="homeCity"></select></div><div class="field"><label>현재 위치</label><select id="currentCity"></select></div><div class="field"><label>나이 <span class="sub">(선택)</span></label><input id="age" type="number" min="13" max="120"></div><div class="field"><label>성별 <span class="sub">(선택)</span></label><select id="gender"><option value="">선택 안 함</option><option value="male">남성</option><option value="female">여성</option><option value="other">기타</option></select></div></div><label class="checkrow"><input id="showEmail" type="checkbox"> 프로필에 이메일 공개</label><button class="save" id="saveProfile">프로필 저장</button></section><section class="card"><div class="facts"><div class="fact"><span>출신 / 거주 기반</span><b id="homeFact">설정 안 됨</b></div><div class="fact"><span>현재 위치</span><b id="currentFact">설정 안 됨</b></div><div class="fact"><span>나이</span><b id="ageFact">비공개</b></div><div class="fact"><span>성별</span><b id="genderFact">비공개</b></div></div></section><section class="card"><h2 class="section-title">여행 기록 추가</h2><div class="trip-form"><div class="grid"><div class="field"><label>도시</label><select id="tripCity"></select></div><div class="field"><label>여행 시작일</label><input id="tripStart" type="date"></div><div class="field"><label>여행 종료일</label><input id="tripEnd" type="date"></div><div class="field"><label>한 줄 기록 <span class="sub">(선택)</span></label><input id="tripNote" maxlength="180"></div></div><button class="add" id="addTrip">여행 기록 저장</button></div></section><section class="card"><h2 class="section-title">현재 · 예정 여행</h2><div id="activeTrips" class="trip-list"></div></section><section class="card"><h2 class="section-title">지난 여행</h2><div id="pastTrips" class="trip-list"></div></section></main><div class="version">songdo · v0.0.2</div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const cities={tokyo:'도쿄',seoul:'서울',incheon:'인천',busan:'부산',newyork:'뉴욕',paris:'파리',london:'런던',barcelona:'바르셀로나',rome:'로마',bangkok:'방콕',singapore:'싱가포르',sydney:'시드니',melbourne:'멜버른',goldcoast:'골드코스트',amsterdam:'암스테르담',oslo:'오슬로',bergen:'베르겐',ustaoset:'우스타오세트',berlin:'베를린',vienna:'빈',prague:'프라하',istanbul:'이스탄불',dubai:'두바이',hongkong:'홍콩',taipei:'타이베이',losangeles:'로스앤젤레스',mexicocity:'멕시코시티'};const genderNames={male:'남성',female:'여성',other:'기타'};const client=supabase.createClient('https://vquxardponweuvuvdtyc.supabase.co','sb_publishable_PbBHugcKsWE_jgpVTou75A_Hq_8oeUy');let session=null,profile=null,visits=[];const opts='<option value="">선택 안 함</option>'+Object.entries(cities).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');['homeCity','currentCity','tripCity'].forEach(id=>document.getElementById(id).innerHTML=opts);function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function fmt(s){return new Date(s+'T00:00:00').toLocaleDateString('ko-KR')}function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function renderAvatar(){const img=document.getElementById('avatar'),ph=document.getElementById('avatarPlaceholder');if(profile?.avatar_url){img.src=profile.avatar_url;img.hidden=false;ph.hidden=true}else{img.hidden=true;ph.hidden=false;ph.textContent=(profile?.nickname||'S').charAt(0).toUpperCase()}}function tripHTML(v,status){return '<div class="trip"><div><div class="trip-name">'+esc(cities[v.city]||v.city)+'</div><span class="status">'+status+'</span>'+(v.note?'<div class="trip-note">'+esc(v.note)+'</div>':'')+'</div><div class="trip-right"><div class="trip-date">'+fmt(v.start_date)+'<br>~ '+fmt(v.end_date)+'</div><button class="delete" onclick="deleteTrip(\''+v.id+'\')">삭제</button></div></div>'}function render(){document.getElementById('displayName').textContent=profile?.nickname||'닉네임을 설정해 주세요';document.getElementById('nickname').value=profile?.nickname||'';document.getElementById('homeCity').value=profile?.home_city||'';document.getElementById('currentCity').value=profile?.current_city||'';document.getElementById('age').value=profile?.age??'';document.getElementById('gender').value=profile?.gender||'';document.getElementById('showEmail').checked=!!profile?.show_email;const el=document.getElementById('emailLine');el.textContent=session?.user?.email||'';el.hidden=!profile?.show_email;document.getElementById('homeFact').textContent=profile?.home_city?(cities[profile.home_city]||profile.home_city):'설정 안 됨';document.getElementById('currentFact').textContent=profile?.current_city?(cities[profile.current_city]||profile.current_city):'설정 안 됨';document.getElementById('ageFact').textContent=profile?.age?profile.age+'세':'비공개';document.getElementById('genderFact').textContent=profile?.gender?(genderNames[profile.gender]||profile.gender):'비공개';renderAvatar();const d=new Date().toISOString().slice(0,10),past=visits.filter(v=>v.end_date<d).sort((a,b)=>b.end_date.localeCompare(a.end_date)),active=visits.filter(v=>v.end_date>=d).sort((a,b)=>a.start_date.localeCompare(b.start_date));document.getElementById('pastTrips').innerHTML=past.length?past.map(v=>tripHTML(v,'방문 완료')).join(''):'<div class="empty">아직 완료된 여행 기록이 없습니다.</div>';document.getElementById('activeTrips').innerHTML=active.length?active.map(v=>tripHTML(v,v.start_date<=d?'여행 중':'방문 예정')).join(''):'<div class="empty">현재 또는 예정된 여행이 없습니다.</div>'}async function load(){const{data}=await client.auth.getSession();session=data.session;if(!session){location.href='/login.html';return}const[p,v]=await Promise.all([client.from('user_profiles').select('user_id,nickname,show_email,home_city,current_city,avatar_url,age,gender').eq('user_id',session.user.id).maybeSingle(),client.from('city_visits').select('id,city,start_date,end_date,note').eq('user_id',session.user.id)]);profile=p.data||{user_id:session.user.id,nickname:session.user.user_metadata?.nickname||null,show_email:false};visits=v.data||[];render()}document.getElementById('saveProfile').onclick=async()=>{const nick=document.getElementById('nickname').value.trim(),ageRaw=document.getElementById('age').value,age=ageRaw?Number(ageRaw):null;if(nick.length<2||nick.length>20){toast('닉네임은 2~20자로 입력해 주세요.');return}if(age!==null&&(age<13||age>120)){toast('나이는 13~120 사이로 입력해 주세요.');return}const{data:dup}=await client.from('user_profiles').select('user_id').ilike('nickname',nick).neq('user_id',session.user.id).limit(1);if(dup?.length){toast('이미 사용 중인 닉네임입니다.');return}const payload={user_id:session.user.id,nickname:nick,show_email:document.getElementById('showEmail').checked,home_city:document.getElementById('homeCity').value||null,current_city:document.getElementById('currentCity').value||null,age,gender:document.getElementById('gender').value||null,avatar_url:profile?.avatar_url||null,updated_at:new Date().toISOString()};const{error}=await client.from('user_profiles').upsert(payload,{onConflict:'user_id'});if(error){toast('저장에 실패했습니다.');console.error(error);return}profile=payload;render();toast('프로필이 저장되었습니다.')}document.getElementById('avatarBtn').onclick=()=>document.getElementById('avatarInput').click();document.getElementById('avatarInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>3*1024*1024){toast('사진은 3MB 이하만 가능합니다.');return}const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=session.user.id+'/avatar.'+ext;const{error}=await client.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type,cacheControl:'3600'});if(error){toast('사진 업로드에 실패했습니다.');console.error(error);return}const{data}=client.storage.from('avatars').getPublicUrl(path),avatarUrl=data.publicUrl+'?v='+Date.now();const payload={...(profile||{}),user_id:session.user.id,avatar_url:avatarUrl,show_email:!!profile?.show_email,updated_at:new Date().toISOString()};const{error:saveError}=await client.from('user_profiles').upsert(payload,{onConflict:'user_id'});if(saveError){toast('사진 저장에 실패했습니다.');return}profile=payload;render();toast('프로필 사진이 변경되었습니다.')}document.getElementById('addTrip').onclick=async()=>{const city=document.getElementById('tripCity').value,start=document.getElementById('tripStart').value,end=document.getElementById('tripEnd').value,note=document.getElementById('tripNote').value.trim();if(!city||!start||!end){toast('도시와 여행 날짜를 입력해 주세요.');return}if(end<start){toast('종료일은 시작일보다 빠를 수 없습니다.');return}const{data,error}=await client.from('city_visits').insert({user_id:session.user.id,city,start_date:start,end_date:end,note:note||null}).select('id,city,start_date,end_date,note').single();if(error){toast('여행 기록 저장에 실패했습니다.');return}visits.push(data);document.getElementById('tripCity').value='';document.getElementById('tripStart').value='';document.getElementById('tripEnd').value='';document.getElementById('tripNote').value='';render();toast('여행 기록이 추가되었습니다.')}async function deleteTrip(id){const{error}=await client.from('city_visits').delete().eq('id',id).eq('user_id',session.user.id);if(error){toast('삭제에 실패했습니다.');return}visits=visits.filter(v=>v.id!==id);render();toast('여행 기록을 삭제했습니다.')}load();</script></body></html>
