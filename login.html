<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 · songdo</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f7ffe8;color:#1d2b16}body{min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(420px,100%)}.brand{display:inline-block;margin-bottom:42px;color:#365c22;text-decoration:none;font-size:30px;font-weight:700;letter-spacing:-.8px}.card{background:#fff;border:1px solid #dcebbf;border-radius:18px;padding:28px;box-shadow:0 16px 50px rgba(76,110,43,.10)}h1{margin:0 0 8px;font-size:26px}.desc{margin:0 0 26px;color:#708060;font-size:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #dcebbf;margin-bottom:24px}.tab{border:0;background:none;padding:12px 6px;font-size:14px;color:#8a987d;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:#4f7d2a;font-weight:700;border-bottom-color:#8fcf4f}label{display:block;margin:0 0 8px;font-size:13px;font-weight:600}input{width:100%;height:46px;padding:0 14px;border:1px solid #cfdfb4;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#8fcf4f;box-shadow:0 0 0 3px #effbdc}.field{margin-bottom:18px}.field.hidden{display:none}.submit{width:100%;height:48px;border:0;border-radius:10px;background:#9bd85b;color:#203315;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px}.submit:disabled{opacity:.55}.message{min-height:22px;margin:16px 0 0;font-size:13px;line-height:1.5;color:#66745b}.message.error{color:#c62828}.back{display:block;margin-top:20px;text-align:center;color:#5f744e;text-decoration:none;font-size:13px}.hint{font-size:11px;color:#8a987d;margin-top:6px}</style></head><body><div class="wrap"><a class="brand" href="/">songdo</a><section class="card"><h1 id="title">로그인</h1><p class="desc" id="desc">여행 기록과 관심 여행지를 저장하세요.</p><div class="tabs"><button class="tab active" id="loginTab" type="button">로그인</button><button class="tab" id="signupTab" type="button">회원가입</button></div><form id="authForm"><div class="field hidden" id="nicknameField"><label for="nickname">닉네임</label><input id="nickname" type="text" maxlength="20" autocomplete="nickname" placeholder="2~20자"><div class="hint">다른 사용자에게 표시되는 이름입니다.</div></div><div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></div><div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="6자 이상"></div><button class="submit" id="submitBtn" type="submit">로그인</button><p class="message" id="message"></p></form></section><a class="back" href="/">← 지도로 돌아가기</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://vquxardponweuvuvdtyc.supabase.co','sb_publishable_PbBHugcKsWE_jgpVTou75A_Hq_8oeUy');let mode='login';const loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab'),form=document.getElementById('authForm'),submitBtn=document.getElementById('submitBtn'),message=document.getElementById('message'),title=document.getElementById('title'),desc=document.getElementById('desc'),password=document.getElementById('password'),nicknameField=document.getElementById('nicknameField'),nickname=document.getElementById('nickname');function setMode(next){mode=next;const login=mode==='login';loginTab.classList.toggle('active',login);signupTab.classList.toggle('active',!login);nicknameField.classList.toggle('hidden',login);nickname.required=!login;title.textContent=login?'로그인':'회원가입';desc.textContent=login?'여행 기록과 관심 여행지를 저장하세요.':'닉네임을 정하고 songdo 계정을 만드세요.';submitBtn.textContent=login?'로그인':'회원가입';password.autocomplete=login?'current-password':'new-password';message.textContent='';message.className='message'}loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');form.onsubmit=async e=>{e.preventDefault();submitBtn.disabled=true;message.textContent='';message.className='message';const email=document.getElementById('email').value.trim(),passwordValue=password.value,nick=nickname.value.trim();try{if(mode==='login'){const{error}=await client.auth.signInWithPassword({email,password:passwordValue});if(error)throw error;location.href='/'}else{if(nick.length<2||nick.length>20)throw new Error('닉네임은 2~20자로 입력해 주세요.');const{data:existing,error:checkError}=await client.from('user_profiles').select('user_id').ilike('nickname',nick).limit(1);if(checkError)throw checkError;if(existing?.length)throw new Error('이미 사용 중인 닉네임입니다.');const{data,error}=await client.auth.signUp({email,password:passwordValue,options:{data:{nickname:nick}}});if(error)throw error;if(data.session)location.href='/profile.html';else message.textContent='가입 확인 메일을 보냈습니다. 이메일 인증 후 로그인해 주세요.'}}catch(err){message.textContent=err.message||'오류가 발생했습니다.';message.className='message error'}finally{submitBtn.disabled=false}};client.auth.getSession().then(({data})=>{if(data.session)location.href='/'})</script></body></html>
