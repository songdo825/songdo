<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 · songdo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; background: #fff; color: #111; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .wrap { width: min(420px, 100%); }
    .brand { display: inline-block; margin-bottom: 42px; color: #111; text-decoration: none; font-size: 30px; font-weight: 700; letter-spacing: -0.8px; }
    .card { border: 1px solid #e7e7e7; border-radius: 18px; padding: 28px; box-shadow: 0 16px 50px rgba(0,0,0,.06); }
    h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -0.6px; }
    .desc { margin: 0 0 26px; color: #777; font-size: 14px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid #e7e7e7; margin-bottom: 24px; }
    .tab { border: 0; background: none; padding: 12px 6px; font-size: 14px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #111; font-weight: 700; border-bottom-color: #111; }
    label { display: block; margin: 0 0 8px; font-size: 13px; font-weight: 600; }
    input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid #dcdcdc; border-radius: 10px; font-size: 15px; outline: none; }
    input:focus { border-color: #111; }
    .field { margin-bottom: 18px; }
    .submit { width: 100%; height: 48px; border: 0; border-radius: 10px; background: #111; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .submit:disabled { opacity: .55; cursor: default; }
    .message { min-height: 22px; margin: 16px 0 0; font-size: 13px; line-height: 1.5; color: #666; }
    .message.error { color: #c62828; }
    .back { display: block; margin-top: 20px; text-align: center; color: #777; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/">songdo</a>
    <section class="card">
      <h1 id="title">로그인</h1>
      <p class="desc" id="desc">여행 기록과 관심 여행지를 저장하세요.</p>

      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">로그인</button>
        <button class="tab" id="signupTab" type="button">회원가입</button>
      </div>

      <form id="authForm">
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" type="email" autocomplete="email" required placeholder="name@example.com" />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="6자 이상" />
        </div>
        <button class="submit" id="submitBtn" type="submit">로그인</button>
        <p class="message" id="message"></p>
      </form>
    </section>
    <a class="back" href="/">← 지도로 돌아가기</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://vquxardponweuvuvdtyc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_PbBHugcKsWE_jgpVTou75A_Hq_8oeUy';
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_KEY);

    let mode = 'login';
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const form = document.getElementById('authForm');
    const submitBtn = document.getElementById('submitBtn');
    const message = document.getElementById('message');
    const title = document.getElementById('title');
    const desc = document.getElementById('desc');
    const password = document.getElementById('password');

    function setMode(next) {
      mode = next;
      const login = mode === 'login';
      loginTab.classList.toggle('active', login);
      signupTab.classList.toggle('active', !login);
      title.textContent = login ? '로그인' : '회원가입';
      desc.textContent = login ? '여행 기록과 관심 여행지를 저장하세요.' : 'songdo 계정을 만들고 여행을 기록하세요.';
      submitBtn.textContent = login ? '로그인' : '회원가입';
      password.autocomplete = login ? 'current-password' : 'new-password';
      message.textContent = '';
      message.className = 'message';
    }

    loginTab.addEventListener('click', () => setMode('login'));
    signupTab.addEventListener('click', () => setMode('signup'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      message.textContent = '';
      message.className = 'message';

      const email = document.getElementById('email').value.trim();
      const passwordValue = password.value;

      try {
        if (mode === 'login') {
          const { error } = await client.auth.signInWithPassword({ email, password: passwordValue });
          if (error) throw error;
          window.location.href = '/';
        } else {
          const { data, error } = await client.auth.signUp({ email, password: passwordValue });
          if (error) throw error;
          if (data.session) {
            window.location.href = '/';
          } else {
            message.textContent = '가입 확인 메일을 보냈습니다. 이메일 인증 후 로그인해 주세요.';
          }
        }
      } catch (err) {
        message.textContent = err.message || '오류가 발생했습니다.';
        message.className = 'message error';
      } finally {
        submitBtn.disabled = false;
      }
    });

    client.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = '/';
    });
  </script>
</body>
</html>
