<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>songdo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
body{overflow:hidden;color:#1d2b16;background:#f7ffe8}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #dcebbf;position:relative;z-index:1000;background:#effbdc}
h1{margin:0;color:#365c22}.header-actions,.auth-area{display:flex;gap:10px;align-items:center}
.language-select,.auth-btn,.trip-btn,.profile-btn{height:38px;border-radius:10px;border:1px solid #86b94f;padding:0 14px;background:#fff;color:#2c431d;font-weight:700}
.auth-btn{background:#9bd85b;color:#203315;text-decoration:none;display:flex;align-items:center;border-color:#9bd85b}
.profile-btn{text-decoration:none;display:flex;align-items:center;font-size:13px}
.app{height:calc(100vh - 72px);display:grid;grid-template-columns:minmax(520px,45%) 1fr}
.sidebar{padding:20px 16px;border-right:1px solid #dcebbf;overflow:auto;background:#fbfff4;z-index:500}
.sidebar h2{margin:0 0 5px;color:#365c22}.sub{margin:0 0 16px;color:#718160;font-size:12px}
.city-list{display:flex;flex-direction:column;gap:8px}.city-card{padding:11px;border:1px solid #dcebbf;border-radius:12px;background:#fff}
.city-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.city-name{font-weight:800;cursor:pointer}
.fav-btn{border:0;background:transparent;font-size:22px;cursor:pointer;color:#c8d7b4}.fav-btn.on{color:#76ad3c}
.social{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:7px}.social span{background:#eff9df;border-radius:7px;padding:5px 3px;text-align:center;font-size:9px;color:#6d7e5d}.social b{display:block;color:#355522;font-size:11px;margin-top:2px}
.ratings{display:grid;grid-template-columns:1fr 1fr;gap:4px}.rating{border:0;border-radius:7px;background:#f4fbe9;padding:6px;text-align:left;cursor:pointer;color:#243719}.rating:hover{background:#e8f7cf}
.rating-label,.rating-count{font-size:9px;color:#6d7e5d}.stars{font-size:11px;white-space:nowrap;color:#659b32}.rating-meta{display:flex;justify-content:space-between;align-items:center}
.map-wrap{position:relative;min-width:0;overflow:hidden}#map{height:100%;background:#dfe9ef}
.map-tint{position:absolute;inset:0;z-index:420;pointer-events:none;mix-blend-mode:multiply;opacity:.26;transition:.25s;background:transparent}
.map-controls{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:900;background:rgba(255,255,255,.94);border:1px solid rgba(0,0,0,.1);border-radius:15px;padding:7px;display:flex;gap:6px;box-shadow:0 8px 26px rgba(0,0,0,.14);backdrop-filter:blur(10px)}
.map-filter{height:38px;border:0;border-radius:10px;padding:0 14px;background:#f4f4f4;color:#4b4b4b;font-weight:800;cursor:pointer;transition:.18s}
.map-filter:hover{transform:translateY(-1px)}.map-filter.active[data-mode="default"]{background:#e7f7d2;color:#365c22}.map-filter.active[data-mode="sports"]{background:#dcecff;color:#1252a3}.map-filter.active[data-mode="festival"]{background:#ffe2e2;color:#a62f2f}.map-filter.active[data-mode="weather"]{background:linear-gradient(90deg,#4e8cff,#55d6d0,#ffd34e,#ff8d3c,#ef3c32);color:#fff;text-shadow:0 1px 2px #3338}.map-filter.active[data-mode="cost"]{background:#fff0a8;color:#725700}
.map-legend{position:absolute;right:18px;bottom:22px;z-index:900;width:205px;background:rgba(255,255,255,.94);border:1px solid rgba(0,0,0,.1);border-radius:13px;padding:12px;box-shadow:0 8px 26px rgba(0,0,0,.12)}
.legend-title{font-size:12px;font-weight:800;margin-bottom:7px}.legend-bar{height:9px;border-radius:999px;margin-bottom:6px}.legend-labels{display:flex;justify-content:space-between;font-size:9px;color:#666}.legend-note{font-size:10px;color:#777;line-height:1.45;margin-top:8px}
.major-city-marker{background:transparent;border:0}.major-city-dot{width:12px;height:12px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px #35552288}
.modal-backdrop{position:fixed;inset:0;background:#24371999;z-index:3000;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}
.modal{width:min(430px,100%);background:#fbfff4;border:1px solid #dcebbf;border-radius:16px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;color:#365c22}
.close-btn{border:0;background:none;font-size:24px;color:#4f6d31}.star-picker{display:flex;gap:6px;margin:15px 0}.star-btn{border:0;background:none;font-size:34px;color:#d6e5c1}.star-btn.active{color:#78b53c}
.save-btn{width:100%;height:42px;border:0;border-radius:10px;background:#9bd85b;color:#203315;font-weight:800}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}
.field select,.field input{width:100%;height:40px;border:1px solid #cfdfb4;border-radius:8px;padding:0 9px;background:#fff;color:#243719}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.budget-result{display:none;margin-top:15px;padding:14px;background:#f1f9e5;border:1px solid #d2e6b5;border-radius:10px}.budget-result.show{display:block}
.lodging-types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.lodging-type{height:42px;border:1px solid #cfdfb4;border-radius:9px;background:#fff;color:#365c22;font-weight:800;cursor:pointer}.lodging-type.active{border-color:#83bd49;background:#9bd85b;color:#203315}
.external-note{font-size:11px;color:#718160;line-height:1.5;margin:10px 0 14px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#527c2d;color:#fff;padding:10px 14px;border-radius:9px;z-index:4000;display:none}.toast.show{display:block}
.version{position:absolute;left:12px;bottom:8px;z-index:900;font-size:9px;color:#68775a;background:#ffffffbb;padding:3px 6px;border-radius:7px}
@media(max-width:900px){.map-controls{left:12px;right:12px;transform:none;overflow:auto;justify-content:flex-start}.map-filter{flex:0 0 auto}.map-legend{right:12px;bottom:14px}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.auth-area span{display:none}.header-actions{gap:6px}.trip-btn,.profile-btn{padding:0 10px}.language-select{display:none}}
</style>
</head>
<body>
<header><h1>songdo</h1><div class="header-actions"><button class="trip-btn" id="openLodging">숙소 검색</button><button class="trip-btn" id="openTrip">방문지 설정</button><select id="languageSelect" class="language-select"><option value="ko">한국어</option><option value="en">English</option></select><div id="authArea" class="auth-area"></div></div></header>
<div class="app">
<aside class="sidebar"><h2>주요 도시 20</h2><p class="sub">실제 사용자 데이터 + 지도 필터를 함께 확인하세요.</p><div id="cityList" class="city-list"></div></aside>
<main class="map-wrap">
  <div id="map"></div><div id="mapTint" class="map-tint"></div>
  <div class="map-controls">
    <button class="map-filter active" data-mode="default">기본</button>
    <button class="map-filter" data-mode="sports">스포츠</button>
    <button class="map-filter" data-mode="festival">페스티벌</button>
    <button class="map-filter" data-mode="weather">날씨</button>
    <button class="map-filter" data-mode="cost">물가</button>
  </div>
  <div id="mapLegend" class="map-legend"></div>
  <div class="version">songdo · v0.0.3</div>
</main>
</div>

<div class="modal-backdrop" id="ratingModal"><div class="modal"><div class="modal-head"><b id="ratingTitle"></b><button class="close-btn" id="closeRating">×</button></div><p id="ratingNote"></p><div id="ratingPicker" class="star-picker"></div><button id="saveRating" class="save-btn">평가 저장</button></div></div>
<div class="modal-backdrop" id="tripModal"><div class="modal"><div class="modal-head"><b>여행 설정 · 예산 계산</b><button class="close-btn" id="closeTrip">×</button></div><div class="grid"><div class="field"><label>출발 도시</label><select id="tripOrigin"></select></div><div class="field"><label>방문 도시</label><select id="tripCity"></select></div></div><div class="grid"><div class="field"><label>출발일</label><input id="tripStart" type="date"></div><div class="field"><label>귀국일</label><input id="tripEnd" type="date"></div></div><div class="field"><label>여행 목적</label><select id="tripPurpose"><option value="sightseeing">관광</option><option value="relax">휴식</option><option value="business">출장</option><option value="shopping">쇼핑</option></select></div><button class="save-btn" id="estimateBtn">방문 일정 저장 + 예산 계산</button><div id="budgetResult" class="budget-result"><b id="budgetRoute"></b><h2 id="budgetTotal"></h2><div id="budgetBreakdown"></div><small>항공권 제외 참고용 추정치입니다.</small></div></div></div>
<div class="modal-backdrop" id="lodgingModal"><div class="modal"><div class="modal-head"><b>숙소 검색</b><button class="close-btn" id="closeLodging">×</button></div><div class="field"><label>도시</label><select id="lodgingCity"></select></div><div class="grid"><div class="field"><label>체크인</label><input id="lodgingCheckin" type="date"></div><div class="field"><label>체크아웃</label><input id="lodgingCheckout" type="date"></div></div><div class="field"><label>숙소 유형</label><div class="lodging-types"><button class="lodging-type active" data-type="hotel">호텔</button><button class="lodging-type" data-type="hostel">호스텔</button><button class="lodging-type" data-type="airbnb">에어비앤비</button></div></div><p class="external-note">현재 실시간 숙소 API를 붙이지 않았기 때문에 임의 숙소나 가격은 표시하지 않습니다. 선택한 조건으로 실제 예약 서비스의 검색 화면을 엽니다.</p><button class="save-btn" id="searchLodging">실제 숙소 검색</button></div></div>
<div id="toast" class="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const cities={
tokyo:{name:'도쿄',pos:[35.6762,139.6503],daily:[135,45,15,35],sports:92,festival:76,temp:27},
seoul:{name:'서울',pos:[37.5665,126.978],daily:[110,38,12,30],sports:84,festival:79,temp:25},
newyork:{name:'뉴욕',pos:[40.7128,-74.006],daily:[230,70,25,55],sports:96,festival:91,temp:23},
paris:{name:'파리',pos:[48.8566,2.3522],daily:[180,55,18,45],sports:86,festival:94,temp:20},
london:{name:'런던',pos:[51.5074,-.1278],daily:[190,60,20,45],sports:95,festival:86,temp:18},
barcelona:{name:'바르셀로나',pos:[41.3874,2.1686],daily:[140,45,15,40],sports:93,festival:88,temp:26},
rome:{name:'로마',pos:[41.9028,12.4964],daily:[145,45,14,42],sports:81,festival:84,temp:26},
bangkok:{name:'방콕',pos:[13.7563,100.5018],daily:[70,25,8,25],sports:63,festival:89,temp:32},
singapore:{name:'싱가포르',pos:[1.3521,103.8198],daily:[145,45,12,35],sports:78,festival:82,temp:31},
sydney:{name:'시드니',pos:[-33.8688,151.2093],daily:[175,55,18,40],sports:91,festival:83,temp:19},
amsterdam:{name:'암스테르담',pos:[52.3676,4.9041],daily:[175,55,18,42],sports:80,festival:92,temp:17},
berlin:{name:'베를린',pos:[52.52,13.405],daily:[130,45,12,35],sports:84,festival:95,temp:18},
vienna:{name:'빈',pos:[48.2082,16.3738],daily:[135,45,12,38],sports:67,festival:86,temp:20},
prague:{name:'프라하',pos:[50.0755,14.4378],daily:[100,35,10,30],sports:65,festival:78,temp:19},
istanbul:{name:'이스탄불',pos:[41.0082,28.9784],daily:[90,30,10,30],sports:88,festival:80,temp:26},
dubai:{name:'두바이',pos:[25.2048,55.2708],daily:[180,55,20,45],sports:82,festival:77,temp:37},
hongkong:{name:'홍콩',pos:[22.3193,114.1694],daily:[150,45,15,35],sports:70,festival:81,temp:30},
taipei:{name:'타이베이',pos:[25.033,121.5654],daily:[100,35,10,30],sports:66,festival:85,temp:29},
losangeles:{name:'로스앤젤레스',pos:[34.0522,-118.2437],daily:[190,60,30,45],sports:94,festival:90,temp:27},
mexicocity:{name:'멕시코시티',pos:[19.4326,-99.1332],daily:[85,30,10,28],sports:86,festival:93,temp:21}
};
const providerNames={tokyo:'Tokyo',seoul:'Seoul',newyork:'New York',paris:'Paris',london:'London',barcelona:'Barcelona',rome:'Rome',bangkok:'Bangkok',singapore:'Singapore',sydney:'Sydney',amsterdam:'Amsterdam',berlin:'Berlin',vienna:'Vienna',prague:'Prague',istanbul:'Istanbul',dubai:'Dubai',hongkong:'Hong Kong',taipei:'Taipei',losangeles:'Los Angeles',mexicocity:'Mexico City'};
const labels={safety:'치안',cost:'물가',sights:'볼거리',english_difficulty:'영어 소통'};
const client=supabase.createClient('https://vquxardponweuvuvdtyc.supabase.co','sb_publishable_PbBHugcKsWE_jgpVTou75A_Hq_8oeUy');
let session=null,rows=[],favorites=[],visits=[],activeCity,activeCategory,draftScore=0,lodgingType='hotel',mapMode='default';
const map=L.map('map',{center:[20,0],zoom:2,minZoom:2});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const cityLayer=L.layerGroup().addTo(map),heatLayer=L.layerGroup().addTo(map);

function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function catRows(c,k){return rows.filter(r=>r.city===c&&r[k]!=null)}
function avg(c,k){const a=catRows(c,k);return a.length?a.reduce((s,r)=>s+Number(r[k]),0)/a.length:null}
function stars(v){return v==null?'☆☆☆☆☆':'★'.repeat(Math.round(v))+'☆'.repeat(5-Math.round(v))}
function today(){return new Date().toISOString().slice(0,10)}
function favCount(c){return favorites.filter(x=>x.city===c).length}
function visitCounts(c){const d=today(),a=visits.filter(x=>x.city===c);return {planned:a.filter(x=>x.start_date>d).length,now:a.filter(x=>x.start_date<=d&&x.end_date>=d).length}}
function myFav(c){return !!session&&favorites.some(x=>x.city===c&&x.user_id===session.user.id)}
function costScore(c){return Math.min(100,Math.round(c.daily.reduce((a,b)=>a+b,0)/4))}
function mix(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16),ar=pa>>16,ag=pa>>8&255,ab=pa&255,br=pb>>16,bg=pb>>8&255,bb=pb&255;return '#'+((1<<24)+(Math.round(ar+(br-ar)*t)<<16)+(Math.round(ag+(bg-ag)*t)<<8)+Math.round(ab+(bb-ab)*t)).toString(16).slice(1)}
function weatherColor(t){if(t<=10)return '#2457d6';if(t<=18)return mix('#2457d6','#40d7cf',(t-10)/8);if(t<=25)return mix('#40d7cf','#ffd23f',(t-18)/7);if(t<=31)return mix('#ffd23f','#ff7a32',(t-25)/6);return mix('#ff7a32','#e92e2e',Math.min(1,(t-31)/9))}
function modeValue(c){if(mapMode==='sports')return c.sports;if(mapMode==='festival')return c.festival;if(mapMode==='weather')return c.temp;if(mapMode==='cost')return costScore(c);return 50}
function modeColor(c){if(mapMode==='sports')return mix('#dbeafe','#0f5bd8',c.sports/100);if(mapMode==='festival')return mix('#ffe1e1','#d52f3c',c.festival/100);if(mapMode==='weather')return weatherColor(c.temp);if(mapMode==='cost')return mix('#fff4b5','#e1aa00',Math.min(1,costScore(c)/100));return '#7fbd42'}
function modeLabel(c){if(mapMode==='sports')return '스포츠 지수 '+c.sports;if(mapMode==='festival')return '페스티벌 지수 '+c.festival;if(mapMode==='weather')return c.temp+'°C';if(mapMode==='cost')return '일일 체감 비용 약 $'+c.daily.reduce((a,b)=>a+b,0);return ''}
function setLegend(){
 const l=document.getElementById('mapLegend'),t=document.getElementById('mapTint');
 if(mapMode==='sports'){l.innerHTML='<div class="legend-title">스포츠 활성도</div><div class="legend-bar" style="background:linear-gradient(90deg,#dbeafe,#0f5bd8)"></div><div class="legend-labels"><span>낮음</span><span>높음</span></div><div class="legend-note">프로스포츠·대형 경기 개최가 활발한 도시일수록 진한 파랑.</div>';t.style.background='#2d74da'}
 else if(mapMode==='festival'){l.innerHTML='<div class="legend-title">페스티벌 활성도</div><div class="legend-bar" style="background:linear-gradient(90deg,#ffe1e1,#d52f3c)"></div><div class="legend-labels"><span>낮음</span><span>높음</span></div><div class="legend-note">음악·문화·도시 축제가 활발할수록 진한 빨강.</div>';t.style.background='#d94747'}
 else if(mapMode==='weather'){l.innerHTML='<div class="legend-title">현재 체감 온도 지도</div><div class="legend-bar" style="background:linear-gradient(90deg,#2457d6,#40d7cf,#ffd23f,#ff7a32,#e92e2e)"></div><div class="legend-labels"><span>추움</span><span>보통</span><span>더움</span></div><div class="legend-note">열화상처럼 차가운 곳은 파랑, 더운 곳은 빨강으로 표시.</div>';t.style.background='linear-gradient(90deg,#2457d6 0%,#40d7cf 25%,#ffd23f 50%,#ff7a32 72%,#e92e2e 100%)'}
 else if(mapMode==='cost'){l.innerHTML='<div class="legend-title">물가 수준</div><div class="legend-bar" style="background:linear-gradient(90deg,#fff4b5,#e1aa00)"></div><div class="legend-labels"><span>저렴</span><span>비쌈</span></div><div class="legend-note">여행 일일비용 기준. 진한 노랑일수록 체감 물가가 높음.</div>';t.style.background='#e0b51b'}
 else{l.innerHTML='<div class="legend-title">기본 여행 지도</div><div class="legend-note">필터를 선택하면 같은 세계지도를 스포츠·페스티벌·날씨·물가 기준으로 다시 볼 수 있습니다.</div>';t.style.background='transparent'}
}
function renderMapMode(){
 heatLayer.clearLayers();
 document.querySelectorAll('.map-filter').forEach(b=>b.classList.toggle('active',b.dataset.mode===mapMode));
 setLegend();
 if(mapMode==='default')return;
 Object.values(cities).forEach(c=>{
   const val=modeValue(c),r=mapMode==='weather'?Math.max(260000,Math.min(520000,300000+Math.abs(c.temp-20)*13000)):250000+val*2200;
   L.circle(c.pos,{radius:r,color:modeColor(c),fillColor:modeColor(c),fillOpacity:.38,weight:1,opacity:.72,interactive:false}).addTo(heatLayer);
 });
}
document.querySelectorAll('.map-filter').forEach(b=>b.onclick=()=>{mapMode=b.dataset.mode;render();renderMapMode()});

async function load(){const [r,f,v]=await Promise.all([client.from('city_ratings').select('user_id,city,safety,cost,sights,english_difficulty'),client.from('city_favorites').select('user_id,city'),client.from('city_visits').select('user_id,city,start_date,end_date')]);rows=r.data||[];favorites=f.data||[];visits=v.data||[];render();renderMapMode()}
function render(){
 cityLayer.clearLayers();
 document.getElementById('cityList').innerHTML=Object.entries(cities).map(([k,c])=>{const vc=visitCounts(k);return '<div class="city-card"><div class="city-head"><span class="city-name" data-go="'+k+'">'+c.name+'</span><button class="fav-btn '+(myFav(k)?'on':'')+'" data-fav="'+k+'">♥</button></div><div class="social"><span>즐겨찾기<b>'+favCount(k)+'명</b></span><span>방문 예정<b>'+vc.planned+'명</b></span><span>방문 중<b>'+vc.now+'명</b></span></div><div class="ratings">'+Object.keys(labels).map(q=>{const a=avg(k,q);return '<button class="rating" data-city="'+k+'" data-cat="'+q+'"><span class="rating-label">'+labels[q]+(a==null?'':' '+a.toFixed(1))+'</span><span class="rating-meta"><span class="stars">'+stars(a)+'</span><span class="rating-count">'+catRows(k,q).length+'명</span></span></button>'}).join('')+'</div></div>'}).join('');
 document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>map.flyTo(cities[x.dataset.go].pos,11));
 document.querySelectorAll('[data-fav]').forEach(x=>x.onclick=()=>toggleFav(x.dataset.fav));
 document.querySelectorAll('.rating').forEach(x=>x.onclick=()=>openRating(x.dataset.city,x.dataset.cat));
 Object.entries(cities).forEach(([k,c])=>{const vc=visitCounts(k),color=modeColor(c),icon=L.divIcon({className:'major-city-marker',html:'<div class="major-city-dot" style="background:'+color+'"></div>',iconSize:[12,12]});L.marker(c.pos,{icon}).addTo(cityLayer).bindTooltip(c.name+(mapMode==='default'?'':' · '+modeLabel(c))).bindPopup('<b>'+c.name+'</b><br>'+(mapMode==='default'?'♥ '+favCount(k)+'명 · 방문 예정 '+vc.planned+'명 · 방문 중 '+vc.now+'명':modeLabel(c)))})
}
function needLogin(){if(session)return true;alert('로그인한 사용자만 사용할 수 있습니다.');return false}
async function toggleFav(c){if(!needLogin())return;if(myFav(c)){await client.from('city_favorites').delete().eq('user_id',session.user.id).eq('city',c)}else{await client.from('city_favorites').insert({user_id:session.user.id,city:c})}await load()}
function openRating(c,k){if(!needLogin())return;activeCity=c;activeCategory=k;const mine=rows.find(r=>r.city===c&&r.user_id===session.user.id);draftScore=mine?.[k]||0;document.getElementById('ratingTitle').textContent=cities[c].name+' · '+labels[k];document.getElementById('ratingNote').textContent=k==='english_difficulty'?'별이 높을수록 영어 소통이 쉽습니다.':'선택한 카테고리만 평가합니다.';pick();document.getElementById('ratingModal').classList.add('open')}
function pick(){document.getElementById('ratingPicker').innerHTML=[1,2,3,4,5].map(n=>'<button class="star-btn '+(n<=draftScore?'active':'')+'" data-v="'+n+'">★</button>').join('');document.querySelectorAll('.star-btn').forEach(x=>x.onclick=()=>{draftScore=+x.dataset.v;pick()})}
document.getElementById('saveRating').onclick=async()=>{if(!draftScore)return;const mine=rows.find(r=>r.city===activeCity&&r.user_id===session.user.id),p=mine?{...mine}:{user_id:session.user.id,city:activeCity,safety:null,cost:null,sights:null,english_difficulty:null};p[activeCategory]=draftScore;await client.from('city_ratings').upsert(p,{onConflict:'user_id,city'});document.getElementById('ratingModal').classList.remove('open');await load()};
document.getElementById('closeRating').onclick=()=>document.getElementById('ratingModal').classList.remove('open');

const origin=document.getElementById('tripOrigin'),dest=document.getElementById('tripCity'),opts=Object.entries(cities).map(([k,c])=>'<option value="'+k+'">'+c.name+'</option>').join('');
origin.innerHTML=opts;dest.innerHTML=opts;origin.value='seoul';dest.value='tokyo';
document.getElementById('openTrip').onclick=()=>document.getElementById('tripModal').classList.add('open');
document.getElementById('closeTrip').onclick=()=>document.getElementById('tripModal').classList.remove('open');
document.getElementById('estimateBtn').onclick=async()=>{const s=document.getElementById('tripStart').value,e=document.getElementById('tripEnd').value;if(origin.value===dest.value||!s||!e||e<s){alert('출발지, 방문지와 기간을 확인해 주세요.');return}const days=Math.max(1,Math.ceil((new Date(e)-new Date(s))/86400000)),base=cities[dest.value].daily,purpose=document.getElementById('tripPurpose').value,m=purpose==='shopping'?1.2:purpose==='business'?1.15:purpose==='relax'?.9:1,vals=base.map((v,i)=>Math.round(v*days*(i?m:1))),total=vals.reduce((a,b)=>a+b,0);document.getElementById('budgetRoute').textContent=cities[origin.value].name+' → '+cities[dest.value].name;document.getElementById('budgetTotal').textContent='$'+total.toLocaleString();document.getElementById('budgetBreakdown').textContent='숙박 $'+vals[0]+' · 식비 $'+vals[1]+' · 교통 $'+vals[2]+' · 활동 $'+vals[3];document.getElementById('budgetResult').classList.add('show');if(session){const {error}=await client.from('city_visits').insert({user_id:session.user.id,city:dest.value,start_date:s,end_date:e});if(!error){toast('방문 일정이 저장되었습니다.');await load()}}else toast('로그인하면 방문 일정도 저장됩니다.')};

const lodgingCity=document.getElementById('lodgingCity');lodgingCity.innerHTML=opts;lodgingCity.value='tokyo';
document.getElementById('openLodging').onclick=()=>{if(dest.value)lodgingCity.value=dest.value;document.getElementById('lodgingModal').classList.add('open')};
document.getElementById('closeLodging').onclick=()=>document.getElementById('lodgingModal').classList.remove('open');
document.querySelectorAll('.lodging-type').forEach(b=>b.onclick=()=>{lodgingType=b.dataset.type;document.querySelectorAll('.lodging-type').forEach(x=>x.classList.toggle('active',x===b))});
document.getElementById('searchLodging').onclick=()=>{const city=lodgingCity.value,checkin=document.getElementById('lodgingCheckin').value,checkout=document.getElementById('lodgingCheckout').value;if(!checkin||!checkout||checkout<=checkin){alert('체크인/체크아웃 날짜를 올바르게 입력해 주세요.');return}const q=encodeURIComponent(providerNames[city]);let url='';if(lodgingType==='airbnb')url='https://www.airbnb.com/s/'+q+'/homes?checkin='+checkin+'&checkout='+checkout;if(lodgingType==='hostel')url='https://www.hostelworld.com/search?search_keywords='+q+'&date_from='+checkin+'&date_to='+checkout;if(lodgingType==='hotel')url='https://www.agoda.com/search?text='+q+'&checkIn='+checkin+'&checkOut='+checkout;window.open(url,'_blank','noopener')};

const auth=document.getElementById('authArea');
async function authRender(){const {data}=await client.auth.getSession();session=data.session;if(!session){auth.innerHTML='<a class="auth-btn" href="/login.html">로그인</a>';return}const {data:p}=await client.from('user_profiles').select('nickname').eq('user_id',session.user.id).maybeSingle();auth.innerHTML='<a class="profile-btn" href="/profile.html">'+(p?.nickname||'내 프로필')+'</a><button id="logout" class="trip-btn">로그아웃</button>';document.getElementById('logout').onclick=()=>client.auth.signOut()}
client.auth.onAuthStateChange(async(_,s)=>{session=s;await authRender();await load()});
(async()=>{await authRender();await load()})();
</script>
</body>
</html>
