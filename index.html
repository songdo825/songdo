<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>songdo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; font-family: Arial, Helvetica, sans-serif; }
    body { background: #fff; color: #111; overflow: hidden; }
    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #e8e8e8;
      background: rgba(255,255,255,0.96);
      position: relative;
      z-index: 1000;
    }
    h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .auth-area { display: flex; align-items: center; gap: 10px; }
    .auth-email { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: #666; }
    .auth-btn { display: inline-flex; align-items: center; justify-content: center; height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid #111; background: #111; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; cursor: pointer; }
    .auth-btn.secondary { background: #fff; color: #111; }

    .app {
      height: calc(100vh - 72px);
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    .sidebar {
      padding: 24px 20px;
      background: #fff;
      border-right: 1px solid #e8e8e8;
      overflow-y: auto;
      z-index: 500;
    }

    .sidebar h2 {
      margin: 0 0 6px;
      font-size: 20px;
      letter-spacing: -0.3px;
    }

    .sidebar .sub {
      margin: 0 0 22px;
      color: #888;
      font-size: 12px;
    }

    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 10px;
      align-items: start;
    }

    .rank-num {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      padding-top: 2px;
    }

    .rank-name {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .rank-score {
      color: #777;
      font-size: 12px;
      font-weight: 400;
    }

    .bar {
      width: 100%;
      height: 6px;
      background: #efefef;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      background: #111;
      border-radius: inherit;
    }

    #map { width: 100%; height: 100%; }
    .leaflet-control-attribution { font-size: 10px; }

    @media (max-width: 760px) {
      header { padding: 0 16px; }
      .auth-email { display: none; }
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: absolute;
        top: 72px;
        left: 0;
        width: 280px;
        height: calc(100vh - 72px);
        box-shadow: 8px 0 24px rgba(0,0,0,0.08);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>songdo</h1>
    <div class="auth-area" id="authArea">
      <a class="auth-btn" href="/login.html">로그인</a>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <h2>인기 여행지</h2>
      <p class="sub">임시 순위</p>

      <div class="rank-list">
        <div class="rank-row">
          <div class="rank-num">1</div>
          <div>
            <div class="rank-name"><span>도쿄</span><span class="rank-score">100</span></div>
            <div class="bar"><span style="width:100%"></span></div>
          </div>
        </div>
        <div class="rank-row">
          <div class="rank-num">2</div>
          <div>
            <div class="rank-name"><span>파리</span><span class="rank-score">92</span></div>
            <div class="bar"><span style="width:92%"></span></div>
          </div>
        </div>
        <div class="rank-row">
          <div class="rank-num">3</div>
          <div>
            <div class="rank-name"><span>방콕</span><span class="rank-score">86</span></div>
            <div class="bar"><span style="width:86%"></span></div>
          </div>
        </div>
        <div class="rank-row">
          <div class="rank-num">4</div>
          <div>
            <div class="rank-name"><span>바르셀로나</span><span class="rank-score">79</span></div>
            <div class="bar"><span style="width:79%"></span></div>
          </div>
        </div>
        <div class="rank-row">
          <div class="rank-num">5</div>
          <div>
            <div class="rank-name"><span>뉴욕</span><span class="rank-score">73</span></div>
            <div class="bar"><span style="width:73%"></span></div>
          </div>
        </div>
      </div>
    </aside>

    <main id="map" aria-label="세계 지도"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      minZoom: 2,
      maxZoom: 18,
      zoomControl: true,
      worldCopyJump: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    map.setMaxBounds([[-85, -180], [85, 180]]);

    const SUPABASE_URL = 'https://vquxardponweuvuvdtyc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_PbBHugcKsWE_jgpVTou75A_Hq_8oeUy';
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_KEY);
    const authArea = document.getElementById('authArea');

    async function renderAuth() {
      const { data } = await client.auth.getSession();
      const session = data.session;

      if (!session) {
        authArea.innerHTML = '<a class="auth-btn" href="/login.html">로그인</a>';
        return;
      }

      const email = session.user.email || '로그인됨';
      authArea.innerHTML = '<span class="auth-email"></span><button class="auth-btn secondary" id="logoutBtn" type="button">로그아웃</button>';
      authArea.querySelector('.auth-email').textContent = email;
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await client.auth.signOut();
        renderAuth();
      });
    }

    renderAuth();
    client.auth.onAuthStateChange(() => renderAuth());
  </script>
</body>
</html>
