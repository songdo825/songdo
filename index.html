let lang=localStorage.getItem('songdoLang')||'ko';if(!translations[lang])lang='ko';const sel=document.getElementById('languageSelect');sel.value=lang;const map=L.map('map',{center:[20,0],zoom:2,minZoom:2,maxZoom:18,worldCopyJump:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);map.setMaxBounds([[-85,-180],[85,180]]);const cityLayer=L.layerGroup().addTo(map),hotelLayer=L.layerGroup().addTo(map);

const SUPABASE_URL='https://vquxardponweuvuvdtyc.supabase.co',SUPABASE_KEY='sb_publishable_PbBHugcKsWE_jgpVTou75A_Hq_8oeUy';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),authArea=document.getElementById('authArea');async function renderAuth(){const t=translations[lang],{data}=await client.auth.getSession();if(!data.session){authArea.innerHTML='<a class="auth-btn" href="/login.html">'+t.login+'</a>';return}authArea.innerHTML='<span class="auth-email">'+(data.session.user.email||'')+'</span><button class="auth-btn secondary" id="logoutBtn">'+t.logout+'</button>';document.getElementById('logoutBtn').onclick=async()=>{await client.auth.signOut();renderAuth()}}
