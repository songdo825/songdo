<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>songdo</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden;color:#1d2b16;background:#f7ffe8}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #dcebbf;position:relative;z-index:1000;background:#effbdc}h1{margin:0;color:#365c22}.header-actions,.auth-area{display:flex;gap:10px;align-items:center}.language-select,.auth-btn,.trip-btn{height:38px;border-radius:10px;border:1px solid #86b94f;padding:0 14px;background:#fff;color:#2c431d;font-weight:700}.auth-btn{background:#9bd85b;color:#203315;text-decoration:none;display:flex;align-items:center;border-color:#9bd85b}.profile-btn{height:38px;border-radius:10px;border:1px solid #86b94f;padding:0 14px;background:#fff;color:#365c22;text-decoration:none;display:flex;align-items:center;font-size:13px;font-weight:700}.app{height:calc(100vh - 72px);display:grid;grid-template-columns:minmax(520px,45%) 1fr}.sidebar{padding:20px 16px;border-right:1px solid #dcebbf;overflow:auto;background:#fbfff4;z-index:500}.sidebar h2{margin:0 0 5px;color:#365c22}.sub{margin:0 0 16px;color:#718160;font-size:12px}.city-list{display:flex;flex-direction:column;gap:8px}.city-card{padding:11px;border:1px solid #dcebbf;border-radius:12px;background:#fff}.city-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.city-name{font-weight:800;cursor:pointer}.fav-btn{border:0;background:transparent;font-size:22px;cursor:pointer;color:#c8d7b4}.fav-btn.on{color:#76ad3c}.social{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:7px}.social span{background:#eff9df;border-radius:7px;padding:5px 3px;text-align:center;font-size:9px;color:#6d7e5d}.social b{display:block;color:#355522;font-size:11px;margin-top:2px}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:4px}.rating{border:0;border-radius:7px;background:#f4fbe9;padding:6px;text-align:left;cursor:pointer;color:#243719}.rating:hover{background:#e8f7cf}.rating-label,.rating-count{font-size:9px;color:#6d7e5d}.stars{font-size:11px;white-space:nowrap;color:#659b32}.rating-meta{display:flex;justify-content:space-between;align-items:center}#map{height:100%}.major-city-marker{background:transparent;border:0}.major-city-dot{width:12px;height:12px;border-radius:50%;background:#7fbd42;border:3px solid #fff;box-shadow:0 1px 5px #35552288}.modal-backdrop{position:fixed;inset:0;background:#24371999;z-index:3000;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{width:min(430px,100%);background:#fbfff4;border:1px solid #dcebbf;border-radius:16px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;color:#365c22}.close-btn{border:0;background:none;font-size:24px;color:#4f6d31}.star-picker{display:flex;gap:6px;margin:15px 0}.star-btn{border:0;background:none;font-size:34px;color:#d6e5c1}.star-btn.active{color:#78b53c}.save-btn{width:100%;height:42px;border:0;border-radius:10px;background:#9bd85b;color:#203315;font-weight:800}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field select,.field input{width:100%;height:40px;border:1px solid #cfdfb4;border-radius:8px;padding:0 9px;background:#fff;color:#243719}.field select:focus,.field input:focus{outline:2px solid #cceba5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.budget-result{display:none;margin-top:15px;padding:14px;background:#f1f9e5;border:1px solid #d2e6b5;border-radius:10px}.budget-result.show{display:block}.lodging-types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.lodging-type{height:42px;border:1px solid #cfdfb4;border-radius:9px;background:#fff;color:#365c22;font-weight:800;cursor:pointer}.lodging-type.active{border-color:#83bd49;background:#9bd85b;color:#203315}.external-note{font-size:11px;color:#718160;line-height:1.5;margin:10px 0 14px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#527c2d;color:#fff;padding:10px 14px;border-radius:9px;z-index:4000;display:none}.toast.show{display:block}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:absolute;top:72px;width:310px;height:calc(100vh - 72px)}.auth-area span{display:none}.header-actions{gap:6px}.trip-btn,.profile-btn{padding:0 10px}}</style></head><body><header><h1>songdo</h1><div class="header-actions"><button class="trip-btn" id="openLodging">숙소 검색</button><button class="trip-btn" id="openTrip">방문지 설정</button><select id="languageSelect" class="language-select"><option value="ko">한국어</option><option value="en">English</option></select><div id="authArea" class="auth-area"></div></div></header><div class="app"><aside class="sidebar"><h2>주요 도시 20</h2><p class="sub">실제 사용자 데이터만 표시합니다. ♥ 즐겨찾기 · 방문 예정 · 방문 중</p><div id="cityList" class="city-list"></div></aside><main id="map"></main></div><div class="modal-backdrop" id="ratingModal"><div class="modal"><div class="modal-head"><b id="ratingTitle"></b><button class="close-btn" id="closeRating">×</button></div><p id="ratingNote"></p><div id="ratingPicker" class="star-picker"></div><button id="saveRating" class="save-btn">평가 저장</button></div></div><div class="modal-backdrop" id="tripModal"><div class="modal"><div class="modal-head"><b>여행 설정 · 예산 계산</b><button class="close-btn" id="closeTrip">×</button></div><div class="grid"><div class="field"><label>출발 도시</label><select id="tripOrigin"></select></div><div class="field"><label>방문 도시</label><select id="tripCity"></select></div></div><div class="grid"><div class="field"><label>출발일</label><input id="tripStart" type="date"></div><div class="field"><label>귀국일</label><input id="tripEnd" type="date"></div></div><div class="field"><label>여행 목적</label><select id="tripPurpose"><option value="sightseeing">관광</option><option value="relax">휴식</option><option value="business">출장</option><option value="shopping">쇼핑</option></select></div><button class="save-btn" id="estimateBtn">방문 일정 저장 + 예산 계산</button><div id="budgetResult" class="budget-result"><b id="budgetRoute"></b><h2 id="budgetTotal"></h2><div id="budgetBreakdown"></div><small>항공권 제외 참고용 추정치입니다.</small></div></div></div><div class="modal-backdrop" id="lodgingModal"><div class="modal"><div class="modal-head"><b>숙소 검색</b><button class="close-btn" id="closeLodging">×</button></div><div class="field"><label>도시</label><select id="lodgingCity"></select></div><div class="grid"><div class="field"><label>체크인</label><input id="lodgingCheckin" type="date"></div><div class="field"><label>체크아웃</label><input id="lodgingCheckout" type="date"></div></div><div class="field"><label>숙소 유형</label><div class="lodging-types"><button class="lodging-type active" data-type="hotel">호텔</button><button class="lodging-type" data-type="hostel">호스텔</button><button class="lodging-type" data-type="airbnb">에어비앤비</button></div></div><p class="external-note">현재 실시간 숙소 API를 붙이지 않았기 때문에 임의 숙소나 가격은 표시하지 않습니다. 선택한 조건으로 실제 예약 서비스의 검색 화면을 엽니다.</p><button class="save-btn" id="searchLodging">실제 숙소 검색</button></div></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const cities={tokyo:{name:'도쿄',pos:[35.6762,139.6503],daily:[135,45,15,35]},seoul:{name:'서울',pos:[37.5665,126.978],daily:[110,38,12,30]},newyork:{name:'뉴욕',pos:[40.7128,-74.006],daily:[230,70,25,55]},paris:{name:'파리',pos:[48.8566,2.3522],daily:[180,55,18,45]},london:{name:'런던',pos:[51.5074,-.1278],daily:[190,60,20,45]},barcelona:{name:'바르셀로나',pos:[41.3874,2.1686],daily:[140,45,15,40]},rome:{name:'로마',pos:[41.9028,12.4964],daily:[145,45,14,42]},bangkok:{name:'방콕',pos:[13.7563,100.5018],daily:[70,25,8,25]},singapore:{name:'싱가포르',pos:[1.3521,103.8198],daily:[145,45,12,35]},sydney:{name:'시드니',pos:[-33.8688,151.2093],daily:[175,55,18,40]},amsterdam:{name:'암스테르담',pos:[52.3676,4.9041],daily:[175,55,18,42]},berlin:{name:'베를린',pos:[52.52,13.405],daily:[130,45,12,35]},vienna:{name:'빈',pos:[48.2082,16.3738],daily:[135,45,12,38]},prague:{name:'프라하',pos:[50.0755,14.4378],daily:[100,35,10,30]},istanbul:{name:'이스탄불',pos:[41.0082,28.9784],daily:[90,30,10,30]},dubai:{name:'두바이',pos:[25.2048,55.2708],daily:[180,55,20,45]},hongkong:{name:'홍콩',pos:[22.3193,114.1694],daily:[150,45,15,35]},taipei:{name:'타이베이',pos:[25.033,121.5654],daily:[100,35,10,30]},losangeles:{name:'로스앤젤레스',pos:[34.0522,-118.2437],daily:[190,60,30,45]},mexicocity:{name:'멕시코시티',pos:[19.4326,-99.1332],daily:[85,30,10,28]}};
const providerNames={tokyo:'Tokyo',seoul:'Seoul',newyork:'New York',paris:'Paris',london:'London',barcelona:'Barcelona',rome:'Rome',bangkok:'Bangkok',singapore:'Singapore',sydney:'Sydney',amsterdam:'Amsterdam',berlin:'Berlin',vienna:'Vienna',prague:'Prague',istanbul:'Istanbul',dubai:'Dubai',hongkong:'Hong Kong',taipei:'Taipei',losangeles:'Los Angeles',mexicocity:'Mexico City'};
const labels={safety:'치안',cost:'물가',sights:'볼거리',english_difficulty:'영어 소통'};const client=supabase.createClient('https://vquxardponweuvuvdtyc.supabase.co','sb_publishable_PbBHugcKsWE_jgpVTou75A_Hq_8oeUy');let session=null,rows=[],favorites=[],visits=[],activeCity,activeCategory,draftScore=0,lodgingType='hotel';const map=L.map('map',{center:[20,0],zoom:2,minZoom:2});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const cityLayer=L.layerGroup().addTo(map);
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function catRows(c,k){return rows.filter(r=>r.city===c&&r[k]!=null)}function avg(c,k){const a=catRows(c,k);return a.length?a.reduce((s,r)=>s+Number(r[k]),0)/a.length:null}function stars(v){return v==null?'☆☆☆☆☆':'★'.repeat(Math.round(v))+'☆'.repeat(5-Math.round(v))}function today(){return new Date().toISOString().slice(0,10)}function favCount(c){return favorites.filter(x=>x.city===c).length}function visitCounts(c){const d=today(),a=visits.filter(x=>x.city===c);return {planned:a.filter(x=>x.start_date>d).length,now:a.filter(x=>x.start_date<=d&&x.end_date>=d).length}}function myFav(c){return !!session&&favorites.some(x=>x.city===c&&x.user_id===session.user.id)}
async function load(){const [r,f,v]=await Promise.all([client.from('city_ratings').select('user_id,city,safety,cost,sights,english_difficulty'),client.from('city_favorites').select('user_id,city'),client.from('city_visits').select('user_id,city,start_date,end_date')]);rows=r.data||[];favorites=f.data||[];visits=v.data||[];render()}
function render(){cityLayer.clearLayers();document.getElementById('cityList').innerHTML=Object.entries(cities).map(([k,c])=>{const vc=visitCounts(k);return '<div class="city-card"><div class="city-head"><span class="city-name" data-go="'+k+'">'+c.name+'</span><button class="fav-btn '+(myFav(k)?'on':'')+'" data-fav="'+k+'">♥</button></div><div class="social"><span>즐겨찾기<b>'+favCount(k)+'명</b></span><span>방문 예정<b>'+vc.planned+'명</b></span><span>방문 중<b>'+vc.now+'명</b></span></div><div class="ratings">'+Object.keys(labels).map(q=>{const a=avg(k,q);return '<button class="rating" data-city="'+k+'" data-cat="'+q+'"><span class="rating-label">'+labels[q]+(a==null?'':' '+a.toFixed(1))+'</span><span class="rating-meta"><span class="stars">'+stars(a)+'</span><span class="rating-count">'+catRows(k,q).length+'명</span></span></button>'}).join('')+'</div></div>'}).join('');document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>map.flyTo(cities[x.dataset.go].pos,11));document.querySelectorAll('[data-fav]').forEach(x=>x.onclick=()=>toggleFav(x.dataset.fav));document.querySelectorAll('.rating').forEach(x=>x.onclick=()=>openRating(x.dataset.city,x.dataset.cat));Object.entries(cities).forEach(([k,c])=>{const vc=visitCounts(k),icon=L.divIcon({className:'major-city-marker',html:'<div class="major-city-dot"></div>',iconSize:[11,11]});L.marker(c.pos,{icon}).addTo(cityLayer).bindTooltip(c.name).bindPopup('<b>'+c.name+'</b><br>♥ '+favCount(k)+'명 · 방문 예정 '+vc.planned+'명 · 방문 중 '+vc.now+'명')})}
function needLogin(){if(session)return true;alert('로그인한 사용자만 사용할 수 있습니다.');return false}async function toggleFav(c){if(!needLogin())return;if(myFav(c)){await client.from('city_favorites').delete().eq('user_id',session.user.id).eq('city',c)}else{await client.from('city_favorites').insert({user_id:session.user.id,city:c})}await load()}
function openRating(c,k){if(!needLogin())return;activeCity=c;activeCategory=k;const mine=rows.find(r=>r.city===c&&r.user_id===session.user.id);draftScore=mine?.[k]||0;document.getElementById('ratingTitle').textContent=cities[c].name+' · '+labels[k];document.getElementById('ratingNote').textContent=k==='english_difficulty'?'별이 높을수록 영어 소통이 쉽습니다.':'선택한 카테고리만 평가합니다.';pick();document.getElementById('ratingModal').classList.add('open')}function pick(){document.getElementById('ratingPicker').innerHTML=[1,2,3,4,5].map(n=>'<button class="star-btn '+(n<=draftScore?'active':'')+'" data-v="'+n+'">★</button>').join('');document.querySelectorAll('.star-btn').forEach(x=>x.onclick=()=>{draftScore=+x.dataset.v;pick()})}document.getElementById('saveRating').onclick=async()=>{if(!draftScore)return;const mine=rows.find(r=>r.city===activeCity&&r.user_id===session.user.id),p=mine?{...mine}:{user_id:session.user.id,city:activeCity,safety:null,cost:null,sights:null,english_difficulty:null};p[activeCategory]=draftScore;await client.from('city_ratings').upsert(p,{onConflict:'user_id,city'});document.getElementById('ratingModal').classList.remove('open');await load()};document.getElementById('closeRating').onclick=()=>document.getElementById('ratingModal').classList.remove('open');
const origin=document.getElementById('tripOrigin'),dest=document.getElementById('tripCity'),opts=Object.entries(cities).map(([k,c])=>'<option value="'+k+'">'+c.name+'</option>').join('');origin.innerHTML=opts;dest.innerHTML=opts;origin.value='seoul';dest.value='tokyo';document.getElementById('openTrip').onclick=()=>document.getElementById('tripModal').classList.add('open');document.getElementById('closeTrip').onclick=()=>document.getElementById('tripModal').classList.remove('open');document.getElementById('estimateBtn').onclick=async()=>{const s=document.getElementById('tripStart').value,e=document.getElementById('tripEnd').value;if(origin.value===dest.value||!s||!e||e<s){alert('출발지, 방문지와 기간을 확인해 주세요.');return}const days=Math.max(1,Math.ceil((new Date(e)-new Date(s))/86400000)),base=cities[dest.value].daily,purpose=document.getElementById('tripPurpose').value,m=purpose==='shopping'?1.2:purpose==='business'?1.15:purpose==='relax'?.9:1,vals=base.map((v,i)=>Math.round(v*days*(i?m:1))),total=vals.reduce((a,b)=>a+b,0);document.getElementById('budgetRoute').textContent=cities[origin.value].name+' → '+cities[dest.value].name;document.getElementById('budgetTotal').textContent='$'+total.toLocaleString();document.getElementById('budgetBreakdown').textContent='숙박 $'+vals[0]+' · 식비 $'+vals[1]+' · 교통 $'+vals[2]+' · 활동 $'+vals[3];document.getElementById('budgetResult').classList.add('show');if(session){const {error}=await client.from('city_visits').upsert({user_id:session.user.id,city:dest.value,start_date:s,end_date:e},{onConflict:'user_id,city'});if(!error){toast('방문 일정이 저장되었습니다.');await load()}}else toast('로그인하면 방문 일정도 저장됩니다.')};
const lodgingCity=document.getElementById('lodgingCity');lodgingCity.innerHTML=opts;lodgingCity.value='tokyo';document.getElementById('openLodging').onclick=()=>{if(dest.value)lodgingCity.value=dest.value;document.getElementById('lodgingModal').classList.add('open')};document.getElementById('closeLodging').onclick=()=>document.getElementById('lodgingModal').classList.remove('open');document.querySelectorAll('.lodging-type').forEach(b=>b.onclick=()=>{lodgingType=b.dataset.type;document.querySelectorAll('.lodging-type').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('searchLodging').onclick=()=>{const city=lodgingCity.value,checkin=document.getElementById('lodgingCheckin').value,checkout=document.getElementById('lodgingCheckout').value;if(!checkin||!checkout||checkout<=checkin){alert('체크인/체크아웃 날짜를 올바르게 입력해 주세요.');return}const q=encodeURIComponent(providerNames[city]);let url='';if(lodgingType==='airbnb')url='https://www.airbnb.com/s/'+q+'/homes?checkin='+checkin+'&checkout='+checkout;if(lodgingType==='hostel')url='https://www.hostelworld.com/search?search_keywords='+q+'&date_from='+checkin+'&date_to='+checkout;if(lodgingType==='hotel')url='https://www.agoda.com/search?text='+q+'&checkIn='+checkin+'&checkOut='+checkout;window.open(url,'_blank','noopener')};
const auth=document.getElementById('authArea');async function authRender(){const {data}=await client.auth.getSession();session=data.session;auth.innerHTML=session?'<a class="profile-btn" href="/profile.html">내 프로필</a><span>'+session.user.email+'</span><button id="logout" class="trip-btn">로그아웃</button>':'<a class="auth-btn" href="/login.html">로그인</a>';if(session)document.getElementById('logout').onclick=()=>client.auth.signOut()}client.auth.onAuthStateChange(async(_,s)=>{session=s;await authRender();await load()});(async()=>{await authRender();await load()})();
</script></body></html>
