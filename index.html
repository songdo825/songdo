<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>songdo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; font-family: Arial, Helvetica, sans-serif; }
    body { background: #fff; color: #111; overflow: hidden; }
    header {
      height: 72px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; border-bottom: 1px solid #e8e8e8; background: rgba(255,255,255,.96);
      position: relative; z-index: 1000;
    }
    h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .language-select {
      height: 38px; padding: 0 34px 0 12px; border: 1px solid #d8d8d8; border-radius: 10px;
      background: #fff; color: #111; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .auth-area { display: flex; align-items: center; gap: 10px; }
    .auth-email { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: #666; }
    .auth-btn { display: inline-flex; align-items: center; justify-content: center; height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid #111; background: #111; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; cursor: pointer; }
    .auth-btn.secondary { background: #fff; color: #111; }
    .app { height: calc(100vh - 72px); display: grid; grid-template-columns: 320px 1fr; }
    .sidebar { padding: 24px 20px; background: #fff; border-right: 1px solid #e8e8e8; overflow-y: auto; z-index: 500; }
    .sidebar h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.3px; }
    .sidebar .sub { margin: 0 0 22px; color: #888; font-size: 12px; line-height: 1.45; }
    .section-title { margin: 28px 0 6px; font-size: 15px; }
    .section-copy { margin: 0 0 14px; font-size: 12px; color: #888; line-height: 1.5; }
    .rank-list { display: flex; flex-direction: column; gap: 10px; }
    .rank-row { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 10px; cursor: pointer; transition: background .15s ease; }
    .rank-row:hover { background: #f6f6f6; }
    .rank-num { font-size: 13px; font-weight: 700; color: #666; }
    .rank-name { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 600; margin-bottom: 7px; }
    .rank-score { color: #777; font-size: 12px; font-weight: 400; }
    .bar { width: 100%; height: 6px; background: #efefef; border-radius: 999px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: #111; border-radius: inherit; }
    .legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #666; }
    .legend-badge { padding: 5px 8px; background: #111; color: #fff; border-radius: 8px; font-weight: 700; }
    #map { width: 100%; height: 100%; background: #eef1f2; }
    .leaflet-control-attribution { font-size: 10px; }
    .price-marker, .map-label-marker { background: transparent; border: 0; }
    .price-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 56px; height: 32px; padding: 0 10px; border: 1px solid #111; border-radius: 10px; background: #fff; color: #111; font-size: 13px; font-weight: 800; box-shadow: 0 3px 12px rgba(0,0,0,.16); white-space: nowrap; }
    .price-pill:hover { background: #111; color: #fff; }
    .country-label { display: inline-block; transform: translate(-50%,-50%); color: #40464c; font-size: 11px; font-weight: 700; text-shadow: 0 1px 2px rgba(255,255,255,.95), 0 0 4px #fff; white-space: nowrap; pointer-events: none; opacity: .9; }
    .city-label { display: inline-block; transform: translate(-50%,-50%); color: #111; font-size: 10px; font-weight: 800; background: rgba(255,255,255,.82); border: 1px solid rgba(0,0,0,.08); border-radius: 6px; padding: 2px 5px; white-space: nowrap; pointer-events: none; }
    .hotel-popup { min-width: 210px; }
    .hotel-popup .city { color: #777; font-size: 11px; margin-bottom: 5px; }
    .hotel-popup .name { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
    .hotel-popup .price { font-size: 13px; margin-bottom: 10px; }
    .hotel-popup .price strong { font-size: 18px; }
    .hotel-popup .note { color: #888; font-size: 10px; line-height: 1.4; margin-bottom: 10px; }
    .hotel-popup a { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 36px; border-radius: 9px; background: #111; color: #fff; text-decoration: none; font-size: 12px; font-weight: 800; }
    @media (max-width: 760px) {
      header { padding: 0 12px; }
      h1 { font-size: 23px; }
      .language-select { width: 112px; }
      .auth-email { display: none; }
      .app { grid-template-columns: 1fr; }
      .sidebar { position: absolute; top: 72px; left: 0; width: 280px; height: calc(100vh - 72px); box-shadow: 8px 0 24px rgba(0,0,0,.08); }
    }
  </style>
</head>
<body>
  <header>
    <h1>songdo</h1>
    <div class="header-actions">
      <select id="languageSelect" class="language-select" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="ko">한국어</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
      </select>
      <div class="auth-area" id="authArea"><a class="auth-btn" href="/login.html">로그인</a></div>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <h2 id="popularTitle"></h2>
      <p class="sub" id="popularSub"></p>
      <div class="rank-list" id="rankList"></div>
      <h3 class="section-title" id="hotelMapTitle"></h3>
      <p class="section-copy" id="hotelMapCopy"></p>
      <div class="legend"><span class="legend-badge">$128</span><span id="nightLegend"></span></div>
    </aside>
    <main id="map" aria-label="World map"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const i18n = {
      en:{login:'Log in',logout:'Log out',signedIn:'Signed in',popular:'Popular destinations',popularSub:'Select a city to explore nearby stays.',hotelMap:'Hotels on the map',hotelCopy:'All displayed prices use USD. Demo prices are placeholders; check Agoda for live rates and availability.',night:'price per night',perNight:'/ night',demo:'Displayed price is for demo purposes. Check Agoda for live date-specific rates and room availability.',agoda:'View on Agoda →',cities:{tokyo:'Tokyo',paris:'Paris',bangkok:'Bangkok',barcelona:'Barcelona',newyork:'New York'},countries:{us:'United States',ca:'Canada',mx:'Mexico',br:'Brazil',ar:'Argentina',gb:'United Kingdom',fr:'France',de:'Germany',es:'Spain',it:'Italy',no:'Norway',se:'Sweden',ru:'Russia',tr:'Türkiye',eg:'Egypt',za:'South Africa',sa:'Saudi Arabia',in:'India',cn:'China',kr:'South Korea',jp:'Japan',th:'Thailand',vn:'Vietnam',id:'Indonesia',au:'Australia',nz:'New Zealand'}},
      es:{login:'Iniciar sesión',logout:'Cerrar sesión',signedIn:'Sesión iniciada',popular:'Destinos populares',popularSub:'Selecciona una ciudad para ver alojamientos cercanos.',hotelMap:'Hoteles en el mapa',hotelCopy:'Todos los precios se muestran en USD. Los precios actuales son de demostración; consulta Agoda para tarifas y disponibilidad reales.',night:'precio por noche',perNight:'/ noche',demo:'El precio mostrado es de demostración. Consulta Agoda para tarifas y disponibilidad reales según la fecha.',agoda:'Ver en Agoda →',cities:{tokyo:'Tokio',paris:'París',bangkok:'Bangkok',barcelona:'Barcelona',newyork:'Nueva York'},countries:{us:'Estados Unidos',ca:'Canadá',mx:'México',br:'Brasil',ar:'Argentina',gb:'Reino Unido',fr:'Francia',de:'Alemania',es:'España',it:'Italia',no:'Noruega',se:'Suecia',ru:'Rusia',tr:'Turquía',eg:'Egipto',za:'Sudáfrica',sa:'Arabia Saudita',in:'India',cn:'China',kr:'Corea del Sur',jp:'Japón',th:'Tailandia',vn:'Vietnam',id:'Indonesia',au:'Australia',nz:'Nueva Zelanda'}},
      ko:{login:'로그인',logout:'로그아웃',signedIn:'로그인됨',popular:'인기 여행지',popularSub:'도시를 누르면 해당 지역 숙소로 이동합니다.',hotelMap:'지도 숙소',hotelCopy:'가격 표시는 전부 USD 기준입니다. 현재 가격은 데모용이며, 실제 예약 가격과 객실 재고는 아고다에서 확인합니다.',night:'1박 가격 표시',perNight:'/ 1박',demo:'표시 가격은 현재 데모용입니다. 실제 날짜별 가격과 객실 재고는 아고다에서 확인하세요.',agoda:'아고다에서 보기 →',cities:{tokyo:'도쿄',paris:'파리',bangkok:'방콕',barcelona:'바르셀로나',newyork:'뉴욕'},countries:{us:'미국',ca:'캐나다',mx:'멕시코',br:'브라질',ar:'아르헨티나',gb:'영국',fr:'프랑스',de:'독일',es:'스페인',it:'이탈리아',no:'노르웨이',se:'스웨덴',ru:'러시아',tr:'튀르키예',eg:'이집트',za:'남아프리카공화국',sa:'사우디아라비아',in:'인도',cn:'중국',kr:'대한민국',jp:'일본',th:'태국',vn:'베트남',id:'인도네시아',au:'호주',nz:'뉴질랜드'}},
      zh:{login:'登录',logout:'退出登录',signedIn:'已登录',popular:'热门目的地',popularSub:'选择城市即可查看附近住宿。',hotelMap:'地图上的酒店',hotelCopy:'所有价格均以美元显示。当前价格为演示数据；实时价格和房态请在 Agoda 查询。',night:'每晚价格',perNight:'/ 晚',demo:'当前显示价格仅为演示。请在 Agoda 查询具体日期的实时价格和房态。',agoda:'在 Agoda 查看 →',cities:{tokyo:'东京',paris:'巴黎',bangkok:'曼谷',barcelona:'巴塞罗那',newyork:'纽约'},countries:{us:'美国',ca:'加拿大',mx:'墨西哥',br:'巴西',ar:'阿根廷',gb:'英国',fr:'法国',de:'德国',es:'西班牙',it:'意大利',no:'挪威',se:'瑞典',ru:'俄罗斯',tr:'土耳其',eg:'埃及',za:'南非',sa:'沙特阿拉伯',in:'印度',cn:'中国',kr:'韩国',jp:'日本',th:'泰国',vn:'越南',id:'印度尼西亚',au:'澳大利亚',nz:'新西兰'}},
      ja:{login:'ログイン',logout:'ログアウト',signedIn:'ログイン済み',popular:'人気の旅行先',popularSub:'都市を選ぶと周辺の宿泊施設を表示します。',hotelMap:'地図上のホテル',hotelCopy:'表示価格はすべて米ドルです。現在の価格はデモ用で、実際の料金と空室状況はAgodaで確認してください。',night:'1泊あたり',perNight:'/ 泊',demo:'表示価格はデモ用です。実際の日付別料金と空室状況はAgodaで確認してください。',agoda:'Agodaで見る →',cities:{tokyo:'東京',paris:'パリ',bangkok:'バンコク',barcelona:'バルセロナ',newyork:'ニューヨーク'},countries:{us:'アメリカ',ca:'カナダ',mx:'メキシコ',br:'ブラジル',ar:'アルゼンチン',gb:'イギリス',fr:'フランス',de:'ドイツ',es:'スペイン',it:'イタリア',no:'ノルウェー',se:'スウェーデン',ru:'ロシア',tr:'トルコ',eg:'エジプト',za:'南アフリカ',sa:'サウジアラビア',in:'インド',cn:'中国',kr:'韓国',jp:'日本',th:'タイ',vn:'ベトナム',id:'インドネシア',au:'オーストラリア',nz:'ニュージーランド'}},
      fr:{login:'Connexion',logout:'Déconnexion',signedIn:'Connecté',popular:'Destinations populaires',popularSub:'Choisissez une ville pour voir les hébergements à proximité.',hotelMap:'Hôtels sur la carte',hotelCopy:'Tous les prix sont affichés en USD. Les prix actuels sont fictifs ; consultez Agoda pour les tarifs et disponibilités réels.',night:'prix par nuit',perNight:'/ nuit',demo:'Le prix affiché est fictif. Consultez Agoda pour les tarifs réels selon les dates et les disponibilités.',agoda:'Voir sur Agoda →',cities:{tokyo:'Tokyo',paris:'Paris',bangkok:'Bangkok',barcelona:'Barcelone',newyork:'New York'},countries:{us:'États-Unis',ca:'Canada',mx:'Mexique',br:'Brésil',ar:'Argentine',gb:'Royaume-Uni',fr:'France',de:'Allemagne',es:'Espagne',it:'Italie',no:'Norvège',se:'Suède',ru:'Russie',tr:'Turquie',eg:'Égypte',za:'Afrique du Sud',sa:'Arabie saoudite',in:'Inde',cn:'Chine',kr:'Corée du Sud',jp:'Japon',th:'Thaïlande',vn:'Vietnam',id:'Indonésie',au:'Australie',nz:'Nouvelle-Zélande'}},
      de:{login:'Anmelden',logout:'Abmelden',signedIn:'Angemeldet',popular:'Beliebte Reiseziele',popularSub:'Wähle eine Stadt, um Unterkünfte in der Nähe zu sehen.',hotelMap:'Hotels auf der Karte',hotelCopy:'Alle Preise werden in USD angezeigt. Die aktuellen Preise sind Demo-Werte; echte Preise und Verfügbarkeiten findest du bei Agoda.',night:'Preis pro Nacht',perNight:'/ Nacht',demo:'Der angezeigte Preis ist ein Demo-Wert. Echte datumsabhängige Preise und Verfügbarkeiten findest du bei Agoda.',agoda:'Auf Agoda ansehen →',cities:{tokyo:'Tokio',paris:'Paris',bangkok:'Bangkok',barcelona:'Barcelona',newyork:'New York'},countries:{us:'Vereinigte Staaten',ca:'Kanada',mx:'Mexiko',br:'Brasilien',ar:'Argentinien',gb:'Vereinigtes Königreich',fr:'Frankreich',de:'Deutschland',es:'Spanien',it:'Italien',no:'Norwegen',se:'Schweden',ru:'Russland',tr:'Türkei',eg:'Ägypten',za:'Südafrika',sa:'Saudi-Arabien',in:'Indien',cn:'China',kr:'Südkorea',jp:'Japan',th:'Thailand',vn:'Vietnam',id:'Indonesien',au:'Australien',nz:'Neuseeland'}}
    };

    const cityViews={tokyo:[35.6762,139.6503],paris:[48.8566,2.3522],bangkok:[13.7563,100.5018],barcelona:[41.3874,2.1686],newyork:[40.7128,-74.006]};
    const rankings=[['tokyo',100],['paris',92],['bangkok',86],['barcelona',79],['newyork',73]];
    const hotels=[
      {city:'tokyo',name:'Shinjuku City Hotel',lat:35.6938,lng:139.7034,price:128},{city:'tokyo',name:'Asakusa Stay',lat:35.7148,lng:139.7967,price:96},{city:'tokyo',name:'Shibuya Central Hotel',lat:35.6595,lng:139.7005,price:154},
      {city:'paris',name:'Paris Central Stay',lat:48.8606,lng:2.3376,price:176},{city:'paris',name:'Montmartre Hotel',lat:48.8867,lng:2.3431,price:142},
      {city:'bangkok',name:'Sukhumvit City Hotel',lat:13.7394,lng:100.5601,price:72},{city:'bangkok',name:'Riverside Bangkok Stay',lat:13.722,lng:100.513,price:88},
      {city:'barcelona',name:'Eixample City Hotel',lat:41.3902,lng:2.1633,price:131},{city:'barcelona',name:'Gothic Quarter Stay',lat:41.3839,lng:2.1763,price:118},
      {city:'newyork',name:'Midtown Manhattan Hotel',lat:40.7549,lng:-73.984,price:219},{city:'newyork',name:'Lower Manhattan Stay',lat:40.7081,lng:-74.0122,price:198}
    ];
    const countryPoints={us:[39,-98],ca:[57,-106],mx:[23,-102],br:[-10,-52],ar:[-37,-64],gb:[55,-3],fr:[46.3,2.2],de:[51,10],es:[40,-4],it:[42.8,12.5],no:[62,10],se:[62,16],ru:[61,90],tr:[39,35],eg:[27,30],za:[-30,24],sa:[24,45],in:[22,79],cn:[35,104],kr:[36.3,127.8],jp:[37,138],th:[15,101],vn:[16,107],id:[-2,118],au:[-25,134],nz:[-42,174]};

    let currentLang=localStorage.getItem('songdoLang') || 'ko';
    const languageSelect=document.getElementById('languageSelect');
    if(!i18n[currentLang]) currentLang='ko';
    languageSelect.value=currentLang;
    document.documentElement.lang=currentLang;

    const map=L.map('map',{center:[20,0],zoom:2,minZoom:2,maxZoom:18,zoomControl:true,worldCopyJump:true});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap contributors &copy; CARTO',subdomains:'abcd',maxZoom:20}).addTo(map);
    map.setMaxBounds([[-85,-180],[85,180]]);

    const mapLabelLayer=L.layerGroup().addTo(map);
    const hotelLayer=L.layerGroup().addTo(map);

    function agodaSearchUrl(hotel){return 'https://www.agoda.com/search?text='+encodeURIComponent(hotel.name+' '+i18n[currentLang].cities[hotel.city]);}
    function renderMapLabels(){
      mapLabelLayer.clearLayers();
      const t=i18n[currentLang];
      Object.entries(countryPoints).forEach(([key,coords])=>{
        const icon=L.divIcon({className:'map-label-marker',html:'<span class="country-label">'+t.countries[key]+'</span>',iconSize:[1,1],iconAnchor:[0,0]});
        L.marker(coords,{icon,interactive:false}).addTo(mapLabelLayer);
      });
      Object.entries(cityViews).forEach(([key,coords])=>{
        const icon=L.divIcon({className:'map-label-marker',html:'<span class="city-label">'+t.cities[key]+'</span>',iconSize:[1,1],iconAnchor:[0,0]});
        L.marker(coords,{icon,interactive:false}).addTo(mapLabelLayer);
      });
    }
    function renderHotels(){
      hotelLayer.clearLayers();
      const t=i18n[currentLang];
      hotels.forEach(hotel=>{
        const icon=L.divIcon({className:'price-marker',html:'<div class="price-pill">$'+hotel.price+'</div>',iconSize:[62,32],iconAnchor:[31,16]});
        const popup='<div class="hotel-popup"><div class="city">'+t.cities[hotel.city]+'</div><div class="name">'+hotel.name+'</div><div class="price"><strong>$'+hotel.price+'</strong> '+t.perNight+'</div><div class="note">'+t.demo+'</div><a href="'+agodaSearchUrl(hotel)+'" target="_blank" rel="noopener noreferrer">'+t.agoda+'</a></div>';
        L.marker([hotel.lat,hotel.lng],{icon}).addTo(hotelLayer).bindPopup(popup,{maxWidth:260});
      });
    }
    function renderSidebar(){
      const t=i18n[currentLang];
      document.getElementById('popularTitle').textContent=t.popular;
      document.getElementById('popularSub').textContent=t.popularSub;
      document.getElementById('hotelMapTitle').textContent=t.hotelMap;
      document.getElementById('hotelMapCopy').textContent=t.hotelCopy;
      document.getElementById('nightLegend').textContent=t.night;
      document.getElementById('map').setAttribute('aria-label', currentLang==='ko'?'세계 지도':'World map');
      document.getElementById('rankList').innerHTML=rankings.map(([city,score],i)=>'<div class="rank-row" data-city="'+city+'"><div class="rank-num">'+(i+1)+'</div><div><div class="rank-name"><span>'+t.cities[city]+'</span><span class="rank-score">'+score+'</span></div><div class="bar"><span style="width:'+score+'%"></span></div></div></div>').join('');
      document.querySelectorAll('.rank-row[data-city]').forEach(row=>row.addEventListener('click',()=>map.flyTo(cityViews[row.dataset.city],12,{duration:1.2})));
    }
    function renderLanguage(){renderSidebar();renderMapLabels();renderHotels();renderAuth();}

    languageSelect.addEventListener('change',e=>{currentLang=e.target.value;localStorage.setItem('songdoLang',currentLang);document.documentElement.lang=currentLang;renderLanguage();});

    const SUPABASE_URL='https://vquxardponweuvuvdtyc.supabase.co';
    const SUPABASE_KEY='sb_publishable_PbBHugcKsWE_jgpVTou75A_Hq_8oeUy';
    const {createClient}=supabase;
    const client=createClient(SUPABASE_URL,SUPABASE_KEY);
    const authArea=document.getElementById('authArea');
    async function renderAuth(){
      const t=i18n[currentLang];
      const {data}=await client.auth.getSession();
      const session=data.session;
      if(!session){authArea.innerHTML='<a class="auth-btn" href="/login.html">'+t.login+'</a>';return;}
      const email=session.user.email||t.signedIn;
      authArea.innerHTML='<span class="auth-email"></span><button class="auth-btn secondary" id="logoutBtn" type="button">'+t.logout+'</button>';
      authArea.querySelector('.auth-email').textContent=email;
      document.getElementById('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();renderAuth();});
    }

    renderLanguage();
    client.auth.onAuthStateChange(()=>renderAuth());
  </script>
</body>
</html>
