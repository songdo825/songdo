let lang=localStorage.getItem('songdoLang')||'ko';if(!translations[lang])lang='ko';const sel=document.getElementById('languageSelect');sel.value=lang;const SUPABASE_URL='https://vquxardponweuvuvdtyc.supabase.co',SUPABASE_KEY='sb_publishable_PbBHugcKsWE_jgpVTou75A_Hq_8oeUy';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const map=L.map('map',{center:[20,0],zoom:2,minZoom:2,maxZoom:18,worldCopyJump:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);map.setMaxBounds([[-85,-180],[85,180]]);const cityLayer=L.layerGroup().addTo(map),hotelLayer=L.layerGroup().addTo(map);let allRatings=[],session=null,activeCity=null,draft={safety:0,cost:0,sights:0,english_difficulty:0};
function t(){return translations[lang]}function money(v){return '$'+Math.round(v).toLocaleString('en-US')}function average(city,key){const rows=allRatings.filter(r=>r.city===city&&r[key]!=null);if(!rows.length)return null;return rows.reduce((a,r)=>a+Number(r[key]),0)/rows.length}function count(city){return allRatings.filter(r=>r.city===city).length}function starText(v){if(v==null)return '☆☆☆☆☆';const n=Math.round(v);return '★'.repeat(n)+'☆'.repeat(5-n)}function fmt(v){return v==null?'':Number(v).toFixed(1)}function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
async function loadRatings(){const {data,error}=await client.from('city_ratings').select('user_id,city,safety,cost,sights,english_difficulty');if(!error)allRatings=data||[];renderCities()}
function requireLogin(){if(session)return true;alert(t().loginRequired);return false}
function openRating(city){if(!requireLogin())return;activeCity=city;const mine=allRatings.find(r=>r.city===city&&r.user_id===session.user.id);draft={safety:mine?.safety||0,cost:mine?.cost||0,sights:mine?.sights||0,english_difficulty:mine?.english_difficulty||0};document.getElementById('ratingTitle').textContent=t().ratingTitle+' · '+t().cities[city];document.getElementById('ratingNote').textContent=t().ratingNote;document.getElementById('safetyLabel').textContent=t().safety;document.getElementById('costLabel').textContent=t().cost;document.getElementById('sightsLabel').textContent=t().sights;document.getElementById('englishLabel').textContent=t().english;document.getElementById('saveRating').textContent=t().save;renderPickers();document.getElementById('ratingModal').classList.add('open')}
function renderPickers(){document.querySelectorAll('.star-picker').forEach(p=>{const key=p.dataset.key;p.innerHTML=[1,2,3,4,5].map(n=>'<button class="star-btn '+(n<=draft[key]?'active':'')+'" data-value="'+n+'">★</button>').join('');p.querySelectorAll('.star-btn').forEach(b=>b.onclick=()=>{draft[key]=Number(b.dataset.value);renderPickers()})});document.getElementById('saveRating').disabled=!(draft.safety&&draft.cost&&draft.sights&&draft.english_difficulty)}
document.getElementById('closeModal').onclick=()=>document.getElementById('ratingModal').classList.remove('open');document.getElementById('ratingModal').onclick=e=>{if(e.target.id==='ratingModal')e.currentTarget.classList.remove('open')};document.getElementById('saveRating').onclick=async()=>{if(!session||!activeCity)return;const payload={user_id:session.user.id,city:activeCity,safety:draft.safety,cost:draft.cost,sights:draft.sights,english_difficulty:draft.english_difficulty};const {error}=await client.from('city_ratings').upsert(payload,{onConflict:'user_id,city'});if(error){showToast(t().saveError);return}document.getElementById('ratingModal').classList.remove('open');showToast(t().saved);await loadRatings()};
function ratingButton(city,label,key){const v=average(city,key);return '<button class="rating rate-trigger" data-rate="'+city+'"><span class="rating-label">'+label+(v!=null?' '+fmt(v):'')+'</span><span class="stars '+(v!=null?'filled':'')+'">'+starText(v)+'</span></button>'}
function renderCities(){const tr=t();cityLayer.clearLayers();document.getElementById('cityTitle').textContent=tr.cityTitle;document.getElementById('citySub').textContent=tr.citySub;document.getElementById('cityList').innerHTML=Object.keys(cities).map(k=>{const c=count(k);return '<div class="city-card"><div class="city-head"><span class="city-name" data-go="'+k+'">'+tr.cities[k]+'</span><span class="'+(c?'count':'unrated')+'">'+(c?c+' '+tr.ratings:tr.unrated)+'</span></div><div class="ratings">'+ratingButton(k,tr.safety,'safety')+ratingButton(k,tr.cost,'cost')+ratingButton(k,tr.sights,'sights')+ratingButton(k,tr.english,'english_difficulty')+'</div></div>'}).join('');document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>map.flyTo(cities[el.dataset.go],11,{duration:1.1}));document.querySelectorAll('.rate-trigger').forEach(el=>el.onclick=e=>{e.stopPropagation();openRating(el.dataset.rate)});Object.entries(cities).forEach(([k,pos])=>{const c=count(k),vals=[['safety',tr.safety],['cost',tr.cost],['sights',tr.sights],['english_difficulty',tr.english]];const icon=L.divIcon({className:'major-city-marker',html:'<div class="major-city-dot"></div>',iconSize:[12,12],iconAnchor:[6,6]});const rows=vals.map(([key,label])=>{const v=average(k,key);return '<div class="popup-rating"><span>'+label+'</span><span>'+starText(v)+(v!=null?' '+fmt(v):'')+'</span></div>'}).join('');const popup='<div class="city-popup"><strong>'+tr.cities[k]+'</strong><div class="popup-ratings">'+rows+'</div><div class="unrated" style="margin-top:8px">'+(c?c+' '+tr.ratings:tr.unrated)+'</div><button class="rate-link" onclick="openRating(\''+k+'\')">'+tr.rate+'</button></div>';L.marker(pos,{icon,zIndexOffset:500}).addTo(cityLayer).bindTooltip(tr.cities[k],{direction:'top',offset:[0,-5]}).bindPopup(popup)})}
function renderHotels(){const tr=t();hotelLayer.clearLayers();document.getElementById('hotelTitle').textContent=tr.hotelTitle;document.getElementById('hotelCopy').textContent=tr.hotelCopy;document.getElementById('nightLegend').textContent=tr.night;hotels.forEach(h=>{const icon=L.divIcon({className:'price-marker',html:'<div class="price-pill">$'+h.price+'</div>',iconSize:[62,32],iconAnchor:[31,16]});const url='https://www.agoda.com/search?text='+encodeURIComponent(h.name+' '+tr.cities[h.city]);const popup='<div class="hotel-popup"><div class="city">'+tr.cities[h.city]+'</div><div class="name">'+h.name+'</div><strong>$'+h.price+'</strong> '+tr.perNight+'<div class="note">'+tr.demo+'</div><a target="_blank" rel="noopener" href="'+url+'">'+tr.agoda+'</a></div>';L.marker([h.lat,h.lng],{icon}).addTo(hotelLayer).bindPopup(popup)})}
function renderTripForm(){const tr=t();document.getElementById('openTrip').textContent=tr.tripButton;document.getElementById('tripTitle').textContent=tr.tripTitle;document.getElementById('tripNote').textContent=tr.tripNote;document.getElementById('destinationLabel').textContent=tr.destination;document.getElementById('startLabel').textContent=tr.start;document.getElementById('endLabel').textContent=tr.end;document.getElementById('purposeLabel').textContent=tr.purpose;document.getElementById('estimateBtn').textContent=tr.estimate;const citySelect=document.getElementById('tripCity'),oldCity=citySelect.value||'tokyo';citySelect.innerHTML=Object.keys(cities).map(k=>'<option value="'+k+'">'+tr.cities[k]+'</option>').join('');citySelect.value=oldCity in cities?oldCity:'tokyo';const purpose=document.getElementById('tripPurpose'),oldPurpose=purpose.value||'sightseeing';purpose.innerHTML=Object.keys(tr.purposes).map(k=>'<option value="'+k+'">'+tr.purposes[k]+'</option>').join('');purpose.value=tr.purposes[oldPurpose]?oldPurpose:'sightseeing'}
document.getElementById('openTrip').onclick=()=>{renderTripForm();document.getElementById('budgetResult').classList.remove('show');document.getElementById('tripModal').classList.add('open')};document.getElementById('closeTrip').onclick=()=>document.getElementById('tripModal').classList.remove('open');document.getElementById('tripModal').onclick=e=>{if(e.target.id==='tripModal')e.currentTarget.classList.remove('open')};document.getElementById('estimateBtn').onclick=()=>{const tr=t(),city=document.getElementById('tripCity').value,purpose=document.getElementById('tripPurpose').value,start=new Date(document.getElementById('tripStart').value+'T00:00:00'),end=new Date(document.getElementById('tripEnd').value+'T00:00:00');const nights=Math.round((end-start)/86400000);if(!Number.isFinite(nights)||nights<1){alert(tr.invalidDates);return}const days=nights+1,b=budgetDaily[city],m=purposeMultipliers[purpose];const parts={stay:b.stay*m.stay*nights,food:b.food*m.food*days,transport:b.transport*m.transport*days,activities:b.activities*m.activities*days},total=Object.values(parts).reduce((a,v)=>a+v,0),low=total*.85,high=total*1.2;document.getElementById('budgetHeading').textContent=tr.budget+' · '+tr.cities[city]+' · '+nights+' nights';document.getElementById('budgetTotal').textContent=money(total);document.getElementById('budgetRange').textContent=tr.range+': '+money(low)+' – '+money(high);document.getElementById('budgetBreakdown').innerHTML=[['stay',tr.stay],['food',tr.food],['transport',tr.transport],['activities',tr.activities]].map(([k,l])=>'<div class="budget-item">'+l+'<strong>'+money(parts[k])+'</strong></div>').join('');document.getElementById('budgetDisclaimer').textContent=tr.disclaimer;document.getElementById('budgetResult').classList.add('show');map.flyTo(cities[city],9,{duration:1.1})};
const authArea=document.getElementById('authArea');async function renderAuth(){const {data}=await client.auth.getSession();session=data.session;if(!session){authArea.innerHTML='<a class="auth-btn" href="/login.html">'+t().login+'</a>';return}authArea.innerHTML='<span class="auth-email">'+(session.user.email||'')+'</span><button class="auth-btn secondary" id="logoutBtn">'+t().logout+'</button>';document.getElementById('logoutBtn').onclick=async()=>{await client.auth.signOut()}}
async function render(){document.documentElement.lang=lang;await renderAuth();renderTripForm();renderHotels();await loadRatings()}sel.onchange=e=>{lang=e.target.value;localStorage.setItem('songdoLang',lang);render()};client.auth.onAuthStateChange(async(_e,s)=>{session=s;await renderAuth();renderCities()});render();
</script>
