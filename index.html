function average(city,key){const rows=allRatings.filter(r=>r.city===city);if(!rows.length)return null;return rows.reduce((a,r)=>a+Number(r[key]),0)/rows.length}function count(city){return allRatings.filter(r=>r.city===city).length}function starText(v){if(v==null)return '☆☆☆☆☆';const n=Math.round(v);return '★'.repeat(n)+'☆'.repeat(5-n)}function fmt(v){return v==null?'':Number(v).toFixed(1)}function t(){return translations[lang]}function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
async function loadRatings(){const {data,error}=await client.from('city_ratings').select('user_id,city,safety,cost,sights');if(!error)allRatings=data||[];renderCities()}
function requireLogin(){if(session)return true;alert(t().loginRequired);return false}
function openRating(city){if(!requireLogin())return;activeCity=city;const mine=allRatings.find(r=>r.city===city&&r.user_id===session.user.id);draft={safety:mine?.safety||0,cost:mine?.cost||0,sights:mine?.sights||0};document.getElementById('ratingTitle').textContent=t().ratingTitle+' · '+t().cities[city];document.getElementById('ratingNote').textContent=t().ratingNote;document.getElementById('safetyLabel').textContent=t().safety;document.getElementById('costLabel').textContent=t().cost;document.getElementById('sightsLabel').textContent=t().sights;document.getElementById('saveRating').textContent=t().save;renderPickers();document.getElementById('ratingModal').classList.add('open')}
function renderPickers(){document.querySelectorAll('.star-picker').forEach(p=>{const key=p.dataset.key;p.innerHTML=[1,2,3,4,5].map(n=>'<button class="star-btn '+(n<=draft[key]?'active':'')+'" data-value="'+n+'">★</button>').join('');p.querySelectorAll('.star-btn').forEach(b=>b.onclick=()=>{draft[key]=Number(b.dataset.value);renderPickers()})});document.getElementById('saveRating').disabled=!(draft.safety&&draft.cost&&draft.sights)}
document.getElementById('closeModal').onclick=()=>document.getElementById('ratingModal').classList.remove('open');document.getElementById('ratingModal').onclick=e=>{if(e.target.id==='ratingModal')e.currentTarget.classList.remove('open')};document.getElementById('saveRating').onclick=async()=>{if(!session||!activeCity)return;const payload={user_id:session.user.id,city:activeCity,safety:draft.safety,cost:draft.cost,sights:draft.sights};const {error}=await client.from('city_ratings').upsert(payload,{onConflict:'user_id,city'});if(error){showToast(t().saveError);return}document.getElementById('ratingModal').classList.remove('open');showToast(t().saved);await loadRatings()};
function renderCities(){const tr=t();cityLayer.clearLayers();document.getElementById('cityTitle').textContent=tr.cityTitle;document.getElementById('citySub').textContent=tr.citySub;document.getElementById('cityList').innerHTML=Object.keys(cities).map(k=>{const c=count(k),sa=average(k,'safety'),co=average(k,'cost'),si=average(k,'sights');return '<div class="city-card" data-city="'+k+'"><div class="city-head"><span class="city-name" data-go="'+k+'">'+tr.cities[k]+'</span><span class="'+(c?'count':'unrated')+'">'+(c?c+' '+tr.ratings:tr.unrated)+'</span></div><div class="ratings"><button class="rating rate-trigger" data-rate="'+k+'"><span class="rating-label">'+tr.safety+(sa!=null?' '+fmt(sa):'')+'</span><span class="stars '+(sa!=null?'filled':'')+'">'+starText(sa)+'</span></button><button class="rating rate-trigger" data-rate="'+k+'"><span class="rating-label">'+tr.cost+(co!=null?' '+fmt(co):'')+'</span><span class="stars '+(co!=null?'filled':'')+'">'+starText(co)+'</span></button><button class="rating rate-trigger" data-rate="'+k+'"><span class="rating-label">'+tr.sights+(si!=null?' '+fmt(si):'')+'</span><span class="stars '+(si!=null?'filled':'')+'">'+starText(si)+'</span></button></div></div>'}).join('');document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>map.flyTo(cities[el.dataset.go],11,{duration:1.1}));document.querySelectorAll('.rate-trigger').forEach(el=>el.onclick=e=>{e.stopPropagation();openRating(el.dataset.rate)});Object.entries(cities).forEach(([k,pos])=>{const sa=average(k,'safety'),co=average(k,'cost'),si=average(k,'sights'),c=count(k);const icon=L.divIcon({className:'major-city-marker',html:'<div class="major-city-dot"></div>',iconSize:[12,12],iconAnchor:[6,6]});const popup='<div class="city-popup"><strong>'+tr.cities[k]+'</strong><div class="popup-ratings"><div class="popup-rating"><span>'+tr.safety+'</span><span>'+starText(sa)+(sa!=null?' '+fmt(sa):'')+'</span></div><div class="popup-rating"><span>'+tr.cost+'</span><span>'+starText(co)+(co!=null?' '+fmt(co):'')+'</span></div><div class="popup-rating"><span>'+tr.sights+'</span><span>'+starText(si)+(si!=null?' '+fmt(si):'')+'</span></div></div><div class="unrated" style="margin-top:8px">'+(c?c+' '+tr.ratings:tr.unrated)+'</div><button class="rate-link" onclick="openRating(\''+k+'\')">'+tr.rate+'</button></div>';L.marker(pos,{icon,zIndexOffset:500}).addTo(cityLayer).bindTooltip(tr.cities[k],{direction:'top',offset:[0,-5]}).bindPopup(popup)})}
function renderHotels(){const tr=t();hotelLayer.clearLayers();document.getElementById('hotelTitle').textContent=tr.hotelTitle;document.getElementById('hotelCopy').textContent=tr.hotelCopy;document.getElementById('nightLegend').textContent=tr.night;hotels.forEach(h=>{const icon=L.divIcon({className:'price-marker',html:'<div class="price-pill">$'+h.price+'</div>',iconSize:[62,32],iconAnchor:[31,16]});const url='https://www.agoda.com/search?text='+encodeURIComponent(h.name+' '+tr.cities[h.city]);const popup='<div class="hotel-popup"><div class="city">'+tr.cities[h.city]+'</div><div class="name">'+h.name+'</div><strong>$'+h.price+'</strong> '+tr.perNight+'<div class="note">'+tr.demo+'</div><a target="_blank" rel="noopener" href="'+url+'">'+tr.agoda+'</a></div>';L.marker([h.lat,h.lng],{icon}).addTo(hotelLayer).bindPopup(popup)})}
