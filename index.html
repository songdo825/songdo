<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>songdo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden;color:#111;background:#fff}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #e8e8e8;background:#fff;position:relative;z-index:1000}h1{margin:0;font-size:28px}.header-actions,.auth-area{display:flex;align-items:center;gap:10px}.language-select,.auth-btn,.trip-btn{height:38px;border-radius:10px;font-size:13px;font-weight:700}.language-select{padding:0 12px;border:1px solid #d8d8d8;background:#fff}.auth-btn,.trip-btn{display:inline-flex;align-items:center;padding:0 16px;border:1px solid #111;background:#111;color:#fff;text-decoration:none;cursor:pointer}.trip-btn,.auth-btn.secondary{background:#fff;color:#111}.auth-email{max-width:200px;font-size:13px;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.app{height:calc(100vh - 72px);display:grid;grid-template-columns:350px 1fr}.sidebar{padding:22px 18px;background:#fff;border-right:1px solid #e8e8e8;overflow-y:auto;z-index:500}.sidebar h2{margin:0 0 6px;font-size:20px}.sub,.section-copy{color:#888;font-size:12px;line-height:1.5}.sub{margin:0 0 18px}.section-title{margin:26px 0 6px;font-size:15px}.city-list{display:flex;flex-direction:column;gap:8px}.city-card{padding:11px 12px;border:1px solid #e5e5e5;border-radius:12px;background:#fff}.city-card:hover{border-color:#aaa}.city-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.city-name{font-size:14px;font-weight:800;cursor:pointer}.ratings{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.rating{padding:8px 6px;border:0;border-radius:8px;background:#f6f6f6;text-align:left;cursor:pointer}.rating:hover{background:#ededed}.rating-label{display:block;font-size:10px;color:#777;margin-bottom:3px}.rating-meta{display:flex;align-items:center;justify-content:space-between;gap:5px}.stars{font-size:12px;letter-spacing:1px;color:#bbb;white-space:nowrap}.filled{color:#111}.rating-count{font-size:10px;color:#999}.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:#666}.legend-badge{padding:5px 8px;background:#111;color:#fff;border-radius:8px;font-weight:700}#map{width:100%;height:100%}.price-marker,.major-city-marker{background:transparent;border:0}.price-pill{display:inline-flex;justify-content:center;align-items:center;min-width:56px;height:32px;padding:0 10px;border:1px solid #111;border-radius:10px;background:#fff;font-size:13px;font-weight:800;box-shadow:0 3px 12px #0002}.major-city-dot{width:12px;height:12px;border:3px solid #fff;border-radius:50%;background:#111;box-shadow:0 1px 6px #0008}.city-popup{min-width:230px}.popup-ratings{margin-top:10px;display:grid;gap:7px}.popup-rating{display:flex;justify-content:space-between;gap:10px;font-size:12px}.popup-count{color:#999;font-size:10px}.modal-backdrop{position:fixed;inset:0;background:#0007;z-index:3000;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{width:min(430px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.modal-title{font-size:20px;font-weight:800}.close-btn{border:0;background:transparent;font-size:24px;cursor:pointer}.modal-note{font-size:11px;color:#888;line-height:1.5;margin:0 0 14px}.star-picker{display:flex;gap:6px;margin-bottom:18px}.star-btn{border:0;background:transparent;padding:0;font-size:34px;line-height:1;color:#ccc;cursor:pointer}.star-btn.active{color:#111}.save-btn{width:100%;height:42px;border:0;border-radius:10px;background:#111;color:#fff;font-size:14px;font-weight:800;cursor:pointer}.save-btn:disabled{opacity:.45}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field select,.field input{width:100%;height:42px;border:1px solid #d8d8d8;border-radius:9px;background:#fff;padding:0 10px;font-size:13px}.date-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.route-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.budget-result{display:none;margin-top:16px;padding:16px;border:1px solid #111;border-radius:12px;background:#fafafa}.budget-result.show{display:block}.budget-route{font-size:12px;font-weight:800;margin-bottom:8px}.budget-total{font-size:27px;font-weight:900;margin:4px 0 8px}.budget-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px;font-size:12px}.budget-item{padding:9px;background:#fff;border:1px solid #e5e5e5;border-radius:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:4000;display:none}.toast.show{display:block}@media(max-width:760px){header{padding:0 10px}h1{font-size:22px}.language-select{width:92px}.trip-btn{padding:0 10px}.auth-email{display:none}.app{grid-template-columns:1fr}.sidebar{position:absolute;top:72px;left:0;width:300px;height:calc(100vh - 72px);box-shadow:8px 0 24px #0001}.date-grid,.route-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>songdo</h1><div class="header-actions"><button class="trip-btn" id="openTrip">방문지 설정</button><select id="languageSelect" class="language-select"><option value="en">English</option><option value="es">Español</option><option value="ko">한국어</option><option value="zh">中文</option><option value="ja">日本語</option><option value="fr">Français</option><option value="de">Deutsch</option></select><div class="auth-area" id="authArea"></div></div></header>
<div class="app"><aside class="sidebar"><h2 id="cityTitle">주요 도시</h2><p class="sub" id="citySub">카테고리별 사용자 평균과 평가 인원을 표시합니다.</p><div id="cityList" class="city-list"></div><h3 class="section-title">지도 숙소</h3><p class="section-copy">숙소 가격은 USD 기준이며 현재 데모 값입니다.</p><div class="legend"><span class="legend-badge">$128</span><span>1박 가격</span></div></aside><main id="map"></main></div>
<div class="modal-backdrop" id="ratingModal"><div class="modal"><div class="modal-head"><div class="modal-title" id="ratingTitle"></div><button class="close-btn" id="closeRating">×</button></div><p class="modal-note" id="ratingNote"></p><div class="star-picker" id="ratingPicker"></div><button class="save-btn" id="saveRating">평가 저장</button></div></div>
<div class="modal-backdrop" id="tripModal"><div class="modal"><div class="modal-head"><div class="modal-title">여행 예산 계산</div><button class="close-btn" id="closeTrip">×</button></div><div class="route-grid"><div class="field"><label>출발 도시</label><select id="tripOrigin"></select></div><div class="field"><label>방문 도시</label><select id="tripCity"></select></div></div><div class="date-grid"><div class="field"><label>출발일</label><input id="tripStart" type="date"></div><div class="field"><label>귀국일</label><input id="tripEnd" type="date"></div></div><div class="field"><label>여행 목적</label><select id="tripPurpose"><option value="sightseeing">관광</option><option value="relax">휴식</option><option value="business">출장</option><option value="shopping">쇼핑</option></select></div><button class="save-btn" id="estimateBtn">예산 계산</button><div class="budget-result" id="budgetResult"><div class="budget-route" id="budgetRoute"></div><div>예상 체류 예산</div><div class="budget-total" id="budgetTotal"></div><div class="budget-breakdown" id="budgetBreakdown"></div><p class="modal-note">항공권 제외 참고용 추정치입니다.</p></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const cities={tokyo:{name:'도쿄',pos:[35.6762,139.6503],daily:[135,45,15,35]},seoul:{name:'서울',pos:[37.5665,126.978],daily:[110,38,12,30]},newyork:{name:'뉴욕',pos:[40.7128,-74.006],daily:[230,70,25,55]},paris:{name:'파리',pos:[48.8566,2.3522],daily:[180,55,18,45]},london:{name:'런던',pos:[51.5074,-.1278],daily:[190,60,20,45]},barcelona:{name:'바르셀로나',pos:[41.3874,2.1686],daily:[140,45,15,40]},rome:{name:'로마',pos:[41.9028,12.4964],daily:[145,45,14,42]},bangkok:{name:'방콕',pos:[13.7563,100.5018],daily:[70,25,8,25]},singapore:{name:'싱가포르',pos:[1.3521,103.8198],daily:[145,45,12,35]},sydney:{name:'시드니',pos:[-33.8688,151.2093],daily:[175,55,18,40]}};
const labels={safety:'치안',cost:'물가',sights:'볼거리',english_difficulty:'영어 소통'};
const SUPABASE_URL='https://vquxardponweuvuvdtyc.supabase.co',SUPABASE_KEY='sb_publishable_PbBHugcKsWE_jgpVTou75A_Hq_8oeUy';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let session=null,rows=[],activeCity=null,activeCategory=null,draftScore=0;
const map=L.map('map',{center:[20,0],zoom:2,minZoom:2,maxZoom:18,worldCopyJump:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);map.setMaxBounds([[-85,-180],[85,180]]);const cityLayer=L.layerGroup().addTo(map);
function categoryRows(city,key){return rows.filter(r=>r.city===city&&r[key]!=null)}function avg(city,key){const a=categoryRows(city,key);if(!a.length)return null;return a.reduce((s,r)=>s+Number(r[key]),0)/a.length}function cnt(city,key){return categoryRows(city,key).length}function stars(v){if(v==null)return '☆☆☆☆☆';const n=Math.round(v);return '★'.repeat(n)+'☆'.repeat(5-n)}function fmt(v){return v==null?'':Number(v).toFixed(1)}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}
async function load(){const {data,error}=await client.from('city_ratings').select('user_id,city,safety,cost,sights,english_difficulty');if(!error)rows=data||[];renderCities()}
function renderCities(){cityLayer.clearLayers();const list=document.getElementById('cityList');list.innerHTML=Object.entries(cities).map(([k,c])=>'<div class="city-card"><div class="city-head"><span class="city-name" data-go="'+k+'">'+c.name+'</span></div><div class="ratings">'+Object.keys(labels).map(key=>{const a=avg(k,key),n=cnt(k,key);return '<button class="rating" data-city="'+k+'" data-cat="'+key+'"><span class="rating-label">'+labels[key]+(a!=null?' '+fmt(a):'')+'</span><span class="rating-meta"><span class="stars '+(a!=null?'filled':'')+'">'+stars(a)+'</span><span class="rating-count">'+n+'명</span></span></button>'}).join('')+'</div></div>').join('');document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>map.flyTo(cities[e.dataset.go].pos,11,{duration:1.1}));document.querySelectorAll('.rating').forEach(e=>e.onclick=()=>openRating(e.dataset.city,e.dataset.cat));Object.entries(cities).forEach(([k,c])=>{const icon=L.divIcon({className:'major-city-marker',html:'<div class="major-city-dot"></div>',iconSize:[12,12],iconAnchor:[6,6]});const html='<div class="city-popup"><strong>'+c.name+'</strong><div class="popup-ratings">'+Object.keys(labels).map(key=>'<div><div class="popup-rating"><span>'+labels[key]+'</span><span>'+stars(avg(k,key))+(avg(k,key)!=null?' '+fmt(avg(k,key)):'')+'</span></div><div class="popup-count">'+cnt(k,key)+'명 평가</div></div>').join('')+'</div></div>';L.marker(c.pos,{icon}).addTo(cityLayer).bindTooltip(c.name,{direction:'top'}).bindPopup(html)})}
function requireLogin(){if(session)return true;alert('별점을 남기려면 먼저 로그인해야 합니다.');return false}
function openRating(city,key){if(!requireLogin())return;activeCity=city;activeCategory=key;const mine=rows.find(r=>r.city===city&&r.user_id===session.user.id);draftScore=mine?.[key]||0;document.getElementById('ratingTitle').textContent=cities[city].name+' · '+labels[key];document.getElementById('ratingNote').textContent=key==='english_difficulty'?'별이 높을수록 영어로 소통하기 쉽다는 뜻입니다.':'이 카테고리만 평가합니다.';renderPicker();document.getElementById('ratingModal').classList.add('open')}
function renderPicker(){const p=document.getElementById('ratingPicker');p.innerHTML=[1,2,3,4,5].map(n=>'<button class="star-btn '+(n<=draftScore?'active':'')+'" data-v="'+n+'">★</button>').join('');p.querySelectorAll('button').forEach(b=>b.onclick=()=>{draftScore=Number(b.dataset.v);renderPicker()});document.getElementById('saveRating').disabled=!draftScore}
document.getElementById('closeRating').onclick=()=>document.getElementById('ratingModal').classList.remove('open');document.getElementById('ratingModal').onclick=e=>{if(e.target.id==='ratingModal')e.currentTarget.classList.remove('open')};document.getElementById('saveRating').onclick=async()=>{if(!session||!activeCity||!activeCategory||!draftScore)return;const mine=rows.find(r=>r.city===activeCity&&r.user_id===session.user.id);const payload=mine?{user_id:session.user.id,city:activeCity,safety:mine.safety,cost:mine.cost,sights:mine.sights,english_difficulty:mine.english_difficulty}:{user_id:session.user.id,city:activeCity,safety:null,cost:null,sights:null,english_difficulty:null};payload[activeCategory]=draftScore;const {error}=await client.from('city_ratings').upsert(payload,{onConflict:'user_id,city'});if(error){toast('저장 중 오류가 발생했습니다.');return}document.getElementById('ratingModal').classList.remove('open');toast('평가가 저장되었습니다.');await load()};
const authArea=document.getElementById('authArea');async function renderAuth(){const {data}=await client.auth.getSession();session=data.session;if(!session){authArea.innerHTML='<a class="auth-btn" href="/login.html">로그인</a>';return}authArea.innerHTML='<span class="auth-email">'+(session.user.email||'')+'</span><button class="auth-btn secondary" id="logoutBtn">로그아웃</button>';document.getElementById('logoutBtn').onclick=async()=>client.auth.signOut()}
const tripOrigin=document.getElementById('tripOrigin'),tripCity=document.getElementById('tripCity');const cityOptions=Object.entries(cities).map(([k,c])=>'<option value="'+k+'">'+c.name+'</option>').join('');tripOrigin.innerHTML=cityOptions;tripCity.innerHTML=cityOptions;tripOrigin.value='seoul';tripCity.value='tokyo';document.getElementById('openTrip').onclick=()=>document.getElementById('tripModal').classList.add('open');document.getElementById('closeTrip').onclick=()=>document.getElementById('tripModal').classList.remove('open');document.getElementById('estimateBtn').onclick=()=>{const origin=tripOrigin.value,destination=tripCity.value;if(origin===destination){alert('출발 도시와 방문 도시는 다르게 선택해 주세요.');return}const s=new Date(document.getElementById('tripStart').value),e=new Date(document.getElementById('tripEnd').value);if(!s.getTime()||!e.getTime()||e<=s){alert('여행 기간을 올바르게 입력해 주세요.');return}const days=Math.max(1,Math.ceil((e-s)/86400000)),base=cities[destination].daily.slice(),purpose=document.getElementById('tripPurpose').value;let mult=1;if(purpose==='shopping')mult=1.2;if(purpose==='business')mult=1.15;if(purpose==='relax')mult=.9;const vals=base.map((v,i)=>Math.round(v*days*(i===0?1:mult))),total=vals.reduce((a,b)=>a+b,0);document.getElementById('budgetRoute').textContent=cities[origin].name+' → '+cities[destination].name;document.getElementById('budgetTotal').textContent='$'+total.toLocaleString();document.getElementById('budgetBreakdown').innerHTML=['숙박','식비','현지 교통','활동'].map((x,i)=>'<div class="budget-item">'+x+'<br><strong>$'+vals[i].toLocaleString()+'</strong></div>').join('');document.getElementById('budgetResult').classList.add('show')};
document.getElementById('languageSelect').value=localStorage.getItem('songdoLang')||'ko';document.getElementById('languageSelect').onchange=e=>localStorage.setItem('songdoLang',e.target.value);client.auth.onAuthStateChange(async(_e,s)=>{session=s;await renderAuth();renderCities()});(async()=>{await renderAuth();await load()})();
</script>
</body>
</html>
